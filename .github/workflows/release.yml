name: Release

on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.16.0
          install-only: true
      - name: Validate tag against live main
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: ./scripts/check-release-state.sh tagged
      - run: make fmt-check vet test build release-snapshot
      - run: ./scripts/verify-release-archives.sh dist
      - run: ./scripts/test-release-guards.sh dist
      - run: ./scripts/test-release-publication.sh

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Recheck tag against live main
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: ./scripts/check-release-state.sh tagged
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.16.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
