      </g><path d="M135.8,204.5 L807.76,204.5" fill="none" stroke="#85857f" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M631.32,294.5 L647.32,294.5 L647.32,497 L1966.03,497 L1966.03,511 L2169.37,511" fill="none" stroke="#85857f" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M631.32,294.5 L775.76,294.5 L775.76,204.5 L807.76,204.5" fill="none" stroke="#85857f" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M1021.76,204.5 L1226.8,204.5" fill="none" stroke="#85857f" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M1446.4,204.5 L1659.03,204.5" fill="none" stroke="#85857f" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M1446.4,204.5 L1462.4,204.5 L1462.4,106 L1966.03,106 L1966.03,180 L2137.37,180 L2137.37,261.5 L2169.37,261.5" fill="none" stroke="#85857f" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M1446.4,204.5 L1462.4,204.5 L1462.4,106 L1966.03,106 L1966.03,343 L2137.37,343 L2137.37,261.5 L2169.37,261.5" fill="none" stroke="#85857f" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M1446.4,204.5 L1462.4,204.5 L1462.4,399.5 L1659.03,399.5" fill="none" stroke="#85857f" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M1446.4,204.5 L1462.4,204.5 L1462.4,106 L1966.03,106 L1966.03,261.5 L2169.37,261.5" fill="none" stroke="#85857f" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M1446.4,204.5 L1462.4,204.5 L1462.4,106 L2169.37,106" fill="none" stroke="#85857f" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M1917.03,399.5 L1966.03,399.5 L1966.03,432 L2169.37,432" fill="none" stroke="#85857f" stroke-width="1.5" marker-end="url(#arrow)"/><g data-element="api.listener"><rect x="375.05999999999995" y="221.5" width="255.2599999999999" height="146" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(604.32 238.5) scale(0.667)" color="#B59669" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="395.06" y="253.5" font-size="14" font-weight="600" fill="#292927"><tspan x="395.06" dy="0">Loopback Listener &amp;</tspan><tspan x="395.06" dy="20">Lifecycle</tspan></text>
      <text x="395.06" y="298.5" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="395.06" dy="0">Binds 127.0.0.1 only (port 4747),</tspan><tspan x="395.06" dy="17">drains on SIGINT/SIGTERM; store</tspan><tspan x="395.06" dy="17">factories yield a fresh store per</tspan><tspan x="395.06" dy="17">access, not per request.</tspan></text>
      </g><g data-element="api.gates"><rect x="808.7599999999998" y="133.5" width="212" height="142" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(994.76 150.5) scale(0.667)" color="#B59669" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="828.76" y="165.5" font-size="14" font-weight="600" fill="#292927"><tspan x="828.76" dy="0">Transport Gates</tspan></text>
      <text x="828.76" y="189.5" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="828.76" dy="0">Host allowlist, forwarded</tspan><tspan x="828.76" dy="17">headers refused, Origin</tspan><tspan x="828.76" dy="17">check on mutating methods,</tspan><tspan x="828.76" dy="17">JSON media type, 64 KiB body</tspan><tspan x="828.76" dy="17">limit, one error envelope.</tspan></text>
      </g><g data-element="api.routes"><rect x="1227.7999999999997" y="89" width="217.59999999999997" height="231" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(1419.4 106) scale(0.667)" color="#B59669" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="1247.8" y="121" font-size="14" font-weight="600" fill="#292927"><tspan x="1247.8" dy="0">Routes &amp;</tspan><tspan x="1247.8" dy="20">Representation</tspan></text>
      <text x="1247.8" y="166" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="1247.8" dy="0">Explicit dispatch: health,</tspan><tspan x="1247.8" dy="17">meta, sections, tasks,</tspan><tspan x="1247.8" dy="17">decisions, delegation, notes,</tspan><tspan x="1247.8" dy="17">projects and section</tspan><tspan x="1247.8" dy="17">actions, views (agenda, next,</tspan><tspan x="1247.8" dy="17">quadrants, inbox, outline),</tspan><tspan x="1247.8" dy="17">recurrence explain.</tspan><tspan x="1247.8" dy="17">Documented /history,</tspan><tspan x="1247.8" dy="17">/events are unserved.</tspan></text>
      </g><g data-element="api.precondition"><rect x="1660.0299999999995" y="123" width="252.4599999999999" height="163" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(1886.49 140) scale(0.667)" color="#B59669" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="1680.03" y="155" font-size="14" font-weight="600" fill="#292927"><tspan x="1680.03" dy="0">ETag / If-Match</tspan><tspan x="1680.03" dy="20">Precondition</tspan></text>
      <text x="1680.03" y="200" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="1680.03" dy="0">Every task-resource write needs a</tspan><tspan x="1680.03" dy="17">quoted If-Match (428 missing, 422</tspan><tspan x="1680.03" dy="17">malformed); stale is 412 with the</tspan><tspan x="1680.03" dy="17">current resource. Project writes:</tspan><tspan x="1680.03" dy="17">none.</tspan></text>
      </g><g data-element="api.seams"><rect x="1660.0299999999995" y="318" width="256" height="163" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(1890.03 335) scale(0.667)" color="#B59669" opacity="0.85"><title>Adapter</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h14l-3-3m3 3-3 3M21 17H7l3-3m-3 3 3 3"/></g></g>
      <text x="1680.03" y="350" font-size="14" font-weight="600" fill="#292927"><tspan x="1680.03" dy="0">Checked Reader &amp;</tspan><tspan x="1680.03" dy="20">Changeset Seams</tspan></text>
      <text x="1680.03" y="395" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="1680.03" dy="0">Two documented gaps in the facade:</tspan><tspan x="1680.03" dy="17">a checked read carrying the global</tspan><tspan x="1680.03" dy="17">store revision, and multi-field</tspan><tspan x="1680.03" dy="17">PATCH straight through the store</tspan><tspan x="1680.03" dy="17">changeset API.</tspan></text>
      </g><g data-outside-port="external" transform="translate(25 181)" role="group" aria-label="Outside scope: External Actors &amp; Stores. 1 connection."><rect width="109.8" height="47" rx="7" fill="#ffffff" stroke="#7d7d77" stroke-width="1.2"/><text x="54.9" y="17" text-anchor="middle" font-size="10" font-weight="600" fill="#292927">External Actors &amp;</text><text x="54.9" y="28" text-anchor="middle" font-size="10" font-weight="600" fill="#292927">Stores</text><text x="54.9" y="40" text-anchor="middle" font-size="8" fill="#6d6d68">outside scope</text></g><g data-outside-port="platform" transform="translate(2170.37 487.5)" role="group" aria-label="Outside scope: Configuration &amp; Harness Pins. 1 connection."><rect width="98.2" height="47" rx="7" fill="#ffffff" stroke="#7d7d77" stroke-width="1.2"/><text x="49.1" y="17" text-anchor="middle" font-size="10" font-weight="600" fill="#292927">Configuration &amp;</text><text x="49.1" y="28" text-anchor="middle" font-size="10" font-weight="600" fill="#292927">Harness Pins</text><text x="49.1" y="40" text-anchor="middle" font-size="8" fill="#6d6d68">outside scope</text></g><g data-outside-port="core" transform="translate(2170.37 238)" role="group" aria-label="Outside scope: Shared Application Core. 6 connections."><rect width="112.8" height="47" rx="7" fill="#ffffff" stroke="#7d7d77" stroke-width="1.2"/><text x="56.4" y="17" text-anchor="middle" font-size="10" font-weight="600" fill="#292927">Shared Application</text><text x="56.4" y="28" text-anchor="middle" font-size="10" font-weight="600" fill="#292927">Core</text><text x="56.4" y="40" text-anchor="middle" font-size="8" fill="#6d6d68">outside scope</text></g><g data-outside-port="platform.jsonout" transform="translate(2170.37 88)" role="group" aria-label="Outside scope: Ordered JSON Writer. 1 connection."><rect width="124.9" height="36" rx="7" fill="#ffffff" stroke="#7d7d77" stroke-width="1.2"/><text x="62.45" y="17" text-anchor="middle" font-size="10" font-weight="600" fill="#292927">Ordered JSON Writer</text><text x="62.45" y="29" text-anchor="middle" font-size="8" fill="#6d6d68">outside scope</text></g><g data-outside-port="store" transform="translate(2170.37 408.5)" role="group" aria-label="Outside scope: Persistence &amp; Invariants. 2 connections."><rect width="89.3" height="47" rx="7" fill="#ffffff" stroke="#7d7d77" stroke-width="1.2"/><text x="44.65" y="17" text-anchor="middle" font-size="10" font-weight="600" fill="#292927">Persistence &amp;</text><text x="44.65" y="28" text-anchor="middle" font-size="10" font-weight="600" fill="#292927">Invariants</text><text x="44.65" y="40" text-anchor="middle" font-size="8" fill="#6d6d68">outside scope</text></g><g><rect x="183.8" y="187" width="109.25999999999996" height="38" rx="5" fill="#f8f8f6"/><text x="238.43" y="200" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="238.43" dy="0">HTTP requests to</tspan><tspan x="238.43" dy="15">127.0.0.1</tspan></text></g><g><rect x="2002.9249999999993" y="493.5" width="113.54999999999997" height="38" rx="5" fill="#f8f8f6"/><text x="2059.6999999999994" y="506.5" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="2059.6999999999994" dy="0">Resolves paths,</tspan><tspan x="2059.6999999999994" dy="15">settings, and pins</tspan></text></g><g><rect x="679.3199999999998" y="300.5" width="80.43999999999998" height="38" rx="5" fill="#f8f8f6"/><text x="719.5399999999998" y="313.5" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="719.5399999999998" dy="0">Serves each</tspan><tspan x="719.5399999999998" dy="15">request</tspan></text></g><g><rect x="1069.7599999999998" y="164.5" width="109.03999999999998" height="38" rx="5" fill="#f8f8f6"/><text x="1124.2799999999997" y="177.5" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="1124.2799999999997" dy="0">Dispatches gated</tspan><tspan x="1124.2799999999997" dy="15">requests</tspan></text></g><g><rect x="1494.3999999999996" y="210.5" width="116.62999999999998" height="38" rx="5" fill="#f8f8f6"/><text x="1552.7149999999997" y="223.5" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="1552.7149999999997" dy="0">Requires If-Match</tspan><tspan x="1552.7149999999997" dy="15">on task writes</tspan></text></g><g><rect x="2011.0649999999998" y="147.5" width="97.27" height="68" rx="5" fill="#f8f8f6"/><text x="2059.7" y="160.5" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="2059.7" dy="0">Create, delete,</tspan><tspan x="2059.7" dy="15">decisions,</tspan><tspan x="2059.7" dy="15">delegation,</tspan><tspan x="2059.7" dy="15">projects</tspan></text></g><g><rect x="2002.9249999999993" y="310.5" width="113.54999999999997" height="68" rx="5" fill="#f8f8f6"/><text x="2059.6999999999994" y="323.5" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="2059.6999999999994" dy="0">Validates</tspan><tspan x="2059.6999999999994" dy="15">recurrence, lead,</tspan><tspan x="2059.6999999999994" dy="15">zone, and link</tspan><tspan x="2059.6999999999994" dy="15">inputs directly ×4</tspan></text></g><g><rect x="1494.9499999999998" y="405.5" width="115.52999999999997" height="38" rx="5" fill="#f8f8f6"/><text x="1552.7149999999997" y="418.5" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="1552.7149999999997" dy="0">Checked reads and</tspan><tspan x="1552.7149999999997" dy="15">multi-field PATCH</tspan></text></g><g><rect x="1998.0299999999993" y="236.5" width="123.33999999999996" height="53" rx="5" fill="#f8f8f6"/><text x="2059.6999999999994" y="249.5" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="2059.6999999999994" dy="0">Named views, the</tspan><tspan x="2059.6999999999994" dy="15">outline, and section</tspan><tspan x="2059.6999999999994" dy="15">roles</tspan></text></g><g><rect x="2002.0449999999998" y="88.5" width="115.30999999999997" height="38" rx="5" fill="#f8f8f6"/><text x="2059.7" y="101.5" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="2059.7" dy="0">Renders envelopes</tspan><tspan x="2059.7" dy="15">and resources</tspan></text></g><g><rect x="2000.6699999999998" y="399.5" width="118.05999999999997" height="68" rx="5" fill="#f8f8f6"/><text x="2059.7" y="412.5" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="2059.7" dy="0">Two named seams:</tspan><tspan x="2059.7" dy="15">checked read,</tspan><tspan x="2059.7" dy="15">guarded changeset</tspan><tspan x="2059.7" dy="15">×2</tspan></text></g></g>
