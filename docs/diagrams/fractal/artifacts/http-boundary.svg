<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description" data-theme="graphite" data-theme-appearance="light">
  <title id="title">Tasks / The Loopback HTTP Boundary</title><desc id="description">Inside tasks-api: the loopback listener, transport gates, explicit routes, the If-Match precondition, and the two named store seams. The client and store sit outside this focus; the HTTP journey walks the full path.. Architecture structure.</desc>
