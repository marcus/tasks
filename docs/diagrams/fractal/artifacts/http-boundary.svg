  <g data-export-layer="title"><text x="96" y="116" font-size="48" font-weight="600" fill="#292927"><tspan x="96" dy="0">Tasks / The Loopback HTTP Boundary</tspan></text></g>
  <g data-export-layer="subtitle"><text x="96" y="170" font-size="19" font-weight="400" fill="#74746f"><tspan x="96" dy="0">Inside tasks-api: the loopback listener, transport gates, explicit routes, the If-Match precondition, and the two named store seams. The client and store sit outside this focus;</tspan><tspan x="96" dy="26">the HTTP journey walks the full path.</tspan></text></g>
