<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description" data-theme="graphite" data-theme-appearance="light">
  <title id="title">Tasks / The Loopback HTTP Boundary</title><desc id="description">Inside tasks-api: the loopback listener, transport gates, explicit routes, the If-Match precondition, and the two named store seams. The client and store sit outside this focus; the HTTP journey walks the full path.. Architecture structure.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#85857f"/></marker></defs>
  <rect width="1920" height="1080" fill="#f8f8f6"/>
  <g font-family="Arial, Helvetica, sans-serif"><text x="96" y="58" font-size="12" letter-spacing="3" fill="#626b6f">FRACTAL / SYSTEM MODEL</text>
  <g data-export-layer="title"><text x="96" y="116" font-size="48" font-weight="600" fill="#292927"><tspan x="96" dy="0">Tasks / The Loopback HTTP Boundary</tspan></text></g>
  <g data-export-layer="subtitle"><text x="96" y="170" font-size="19" font-weight="400" fill="#74746f"><tspan x="96" dy="0">Inside tasks-api: the loopback listener, transport gates, explicit routes, the If-Match precondition, and the two named store seams. The client and store sit outside this focus;</tspan><tspan x="96" dy="26">the HTTP journey walks the full path.</tspan></text></g>
  <g data-export-layer="diagram" transform="translate(96 332.423) scale(1.053)"><g data-element="api"><rect x="25" y="24" width="1590.9699999999996" height="464" rx="14" fill="#eeeeeb" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(1589.97 41) scale(0.667)" color="#B59669" opacity="0.85"><title>Subsystem</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="13" height="13" rx="2"/><path d="M8 5V3h13v13h-2"/></g></g>
      <text x="49" y="54" font-size="14" font-weight="600" fill="#292927"><tspan x="49" dy="0">tasks-api</tspan></text>
      <text x="45" y="78" font-size="12" font-weight="400" fill="#6d6d68"></text>
      </g><path d="M306.26,187.5 L482.7,187.5" fill="none" stroke="#85857f" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M696.7,187.5 L901.74,187.5" fill="none" stroke="#85857f" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M1121.34,187.5 L1333.97,187.5" fill="none" stroke="#85857f" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M1121.34,187.5 L1137.34,187.5 L1137.34,382.5 L1333.97,382.5" fill="none" stroke="#85857f" stroke-width="1.5" marker-end="url(#arrow)"/><g data-element="api.listener"><rect x="49.99999999999997" y="114.5" width="255.2599999999999" height="146" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(279.26 131.5) scale(0.667)" color="#B59669" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="70" y="146.5" font-size="14" font-weight="600" fill="#292927"><tspan x="70" dy="0">Loopback Listener &amp;</tspan><tspan x="70" dy="20">Lifecycle</tspan></text>
      <text x="70" y="191.5" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="70" dy="0">Binds 127.0.0.1 only (port 4747),</tspan><tspan x="70" dy="17">drains on SIGINT/SIGTERM; store</tspan><tspan x="70" dy="17">factories yield a fresh store per</tspan><tspan x="70" dy="17">access, not per request.</tspan></text>
      </g><g data-element="api.gates"><rect x="483.6999999999999" y="116.5" width="212" height="142" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(669.7 133.5) scale(0.667)" color="#B59669" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="503.7" y="148.5" font-size="14" font-weight="600" fill="#292927"><tspan x="503.7" dy="0">Transport Gates</tspan></text>
      <text x="503.7" y="172.5" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="503.7" dy="0">Host allowlist, forwarded</tspan><tspan x="503.7" dy="17">headers refused, Origin</tspan><tspan x="503.7" dy="17">check on mutating methods,</tspan><tspan x="503.7" dy="17">JSON media type, 64 KiB body</tspan><tspan x="503.7" dy="17">limit, one error envelope.</tspan></text>
      </g><g data-element="api.routes"><rect x="902.7399999999998" y="89" width="217.59999999999997" height="197" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(1094.34 106) scale(0.667)" color="#B59669" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="922.74" y="121" font-size="14" font-weight="600" fill="#292927"><tspan x="922.74" dy="0">Routes &amp;</tspan><tspan x="922.74" dy="20">Representation</tspan></text>
      <text x="922.74" y="166" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="922.74" dy="0">Explicit dispatch: health,</tspan><tspan x="922.74" dy="17">meta, sections, tasks,</tspan><tspan x="922.74" dy="17">decisions, delegation, notes,</tspan><tspan x="922.74" dy="17">projects, recurrence</tspan><tspan x="922.74" dy="17">explain. Documented /views,</tspan><tspan x="922.74" dy="17">/history, /events are</tspan><tspan x="922.74" dy="17">unserved.</tspan></text>
      </g><g data-element="api.precondition"><rect x="1334.9699999999996" y="106" width="252.4599999999999" height="163" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(1561.43 123) scale(0.667)" color="#B59669" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="1354.97" y="138" font-size="14" font-weight="600" fill="#292927"><tspan x="1354.97" dy="0">ETag / If-Match</tspan><tspan x="1354.97" dy="20">Precondition</tspan></text>
      <text x="1354.97" y="183" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="1354.97" dy="0">Every task-resource write needs a</tspan><tspan x="1354.97" dy="17">quoted If-Match (428 missing, 422</tspan><tspan x="1354.97" dy="17">malformed); stale is 412 with the</tspan><tspan x="1354.97" dy="17">current resource. Project writes:</tspan><tspan x="1354.97" dy="17">none.</tspan></text>
      </g><g data-element="api.seams"><rect x="1334.9699999999996" y="301" width="256" height="163" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(1564.97 318) scale(0.667)" color="#B59669" opacity="0.85"><title>Adapter</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h14l-3-3m3 3-3 3M21 17H7l3-3m-3 3 3 3"/></g></g>
      <text x="1354.97" y="333" font-size="14" font-weight="600" fill="#292927"><tspan x="1354.97" dy="0">Checked Reader &amp;</tspan><tspan x="1354.97" dy="20">Changeset Seams</tspan></text>
      <text x="1354.97" y="378" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="1354.97" dy="0">Two documented gaps in the facade:</tspan><tspan x="1354.97" dy="17">a checked read carrying the global</tspan><tspan x="1354.97" dy="17">store revision, and multi-field</tspan><tspan x="1354.97" dy="17">PATCH straight through the store</tspan><tspan x="1354.97" dy="17">changeset API.</tspan></text>
      </g><g><rect x="354.2599999999999" y="193.5" width="80.43999999999998" height="38" rx="5" fill="#f8f8f6"/><text x="394.47999999999985" y="206.5" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="394.47999999999985" dy="0">Serves each</tspan><tspan x="394.47999999999985" dy="15">request</tspan></text></g><g><rect x="744.6999999999998" y="193.5" width="109.03999999999998" height="38" rx="5" fill="#f8f8f6"/><text x="799.2199999999998" y="206.5" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="799.2199999999998" dy="0">Dispatches gated</tspan><tspan x="799.2199999999998" dy="15">requests</tspan></text></g><g><rect x="1169.3399999999997" y="147.5" width="116.62999999999998" height="38" rx="5" fill="#f8f8f6"/><text x="1227.6549999999997" y="160.5" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="1227.6549999999997" dy="0">Requires If-Match</tspan><tspan x="1227.6549999999997" dy="15">on task writes</tspan></text></g><g><rect x="1169.8899999999999" y="388.5" width="115.52999999999997" height="38" rx="5" fill="#f8f8f6"/><text x="1227.6549999999997" y="401.5" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="1227.6549999999997" dy="0">Checked reads and</tspan><tspan x="1227.6549999999997" dy="15">multi-field PATCH</tspan></text></g></g>
  <g data-export-layer="legend"></g><path d="M96 1010H1824" stroke="#ddddda"/><text x="96" y="1044" font-size="13" fill="#7d7d77">STRUCTURE · CURRENT SYSTEM</text><text x="1824" y="1044" text-anchor="end" font-size="13" fill="#7d7d77">FOCUS: tasks-api · 10 external connections outside view</text></g></svg>
