  <g data-export-layer="title"><text x="96" y="116" font-size="48" font-weight="600" fill="#292927"><tspan x="96" dy="0">Tasks / Inside tasks-tui and the pkg/tui Surface</tspan></text></g>
  <g data-export-layer="subtitle"><text x="96" y="170" font-size="19" font-weight="400" fill="#74746f"><tspan x="96" dy="0">The standalone tasks-tui runtime, the shortcut registry, the agent prompt queue, session state, and the public pkg/tui surface a host such as Sidecar embeds.</tspan></text></g>
