      </g><path d="M307,562.5 L512.04,562.5" fill="none" stroke="#85857f" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M307,562.5 L323,562.5 L323,147 L915.36,147 L915.36,164 L947.36,164" fill="none" stroke="#85857f" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M726.04,562.5 L968.43,562.5" fill="none" stroke="#85857f" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M726.04,562.5 L742.04,562.5 L742.04,164 L947.36,164" fill="none" stroke="#85857f" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M726.04,562.5 L742.04,562.5 L742.04,359 L947.36,359" fill="none" stroke="#85857f" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M726.04,562.5 L742.04,562.5 L742.04,755.5 L947.36,755.5" fill="none" stroke="#85857f" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M1182.57,562.5 L1393.39,562.5" fill="none" stroke="#85857f" stroke-width="1.5" marker-end="url(#arrow)"/><g data-element="tui.runtime"><rect x="513.04" y="481" width="212" height="163" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(699.04 498) scale(0.667)" color="#759EB5" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="533.04" y="513" font-size="14" font-weight="600" fill="#292927"><tspan x="533.04" dy="0">Runtime &amp; Model</tspan><tspan x="533.04" dy="20">Loop</tspan></text>
      <text x="533.04" y="558" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="533.04" dy="0">Builds the facade over a</tspan><tspan x="533.04" dy="17">host-wired writer store;</tspan><tspan x="533.04" dy="17">the model re-reads rows</tspan><tspan x="533.04" dy="17">when the file stat changes</tspan><tspan x="533.04" dy="17">or the local date rolls.</tspan></text>
      </g><g data-element="tui.views"><rect x="969.4299999999998" y="481" width="212.13999999999996" height="163" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(1155.57 498) scale(0.667)" color="#759EB5" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="989.43" y="513" font-size="14" font-weight="600" fill="#292927"><tspan x="989.43" dy="0">Views, Rows &amp; Task</tspan><tspan x="989.43" dy="20">Panel</tspan></text>
      <text x="989.43" y="558" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="989.43" dy="0">Agenda, Next, Quadrants,</tspan><tspan x="989.43" dy="17">Inbox, Projects, Outline</tspan><tspan x="989.43" dy="17">rows, list actions, the</tspan><tspan x="989.43" dy="17">read-first task panel, and</tspan><tspan x="989.43" dy="17">save-on-blur edits.</tspan></text>
      </g><g data-element="tui.shortcuts"><rect x="948.3599999999999" y="91" width="254.27999999999992" height="146" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(1176.64 108) scale(0.667)" color="#759EB5" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="968.36" y="123" font-size="14" font-weight="600" fill="#292927"><tspan x="968.36" dy="0">Shortcut Registry &amp;</tspan><tspan x="968.36" dy="20">Commands</tspan></text>
      <text x="968.36" y="168" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="968.36" dy="0">Declarative registry of every key</tspan><tspan x="968.36" dy="17">action with focus context and</tspan><tspan x="968.36" dy="17">availability; exported to hosts and</tspan><tspan x="968.36" dy="17">rendered in help.</tspan></text>
      </g><g data-element="tui.chrome"><rect x="1394.3899999999999" y="481" width="232.29999999999993" height="163" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(1600.69 498) scale(0.667)" color="#759EB5" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="1414.39" y="513" font-size="14" font-weight="600" fill="#292927"><tspan x="1414.39" dy="0">Terminal Primitives &amp;</tspan><tspan x="1414.39" dy="20">Theme</tspan></text>
      <text x="1414.39" y="558" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="1414.39" dy="0">Styler seam over term/: theme</tspan><tspan x="1414.39" dy="17">slots, ANSI width and wrap,</tspan><tspan x="1414.39" dy="17">borders, buttons, key chips,</tspan><tspan x="1414.39" dy="17">scroll regions, status line,</tspan><tspan x="1414.39" dy="17">modals, forms.</tspan></text>
      </g><g data-element="tui.queue"><rect x="948.3599999999999" y="269" width="212" height="180" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(1134.36 286) scale(0.667)" color="#759EB5" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="968.36" y="301" font-size="14" font-weight="600" fill="#292927"><tspan x="968.36" dy="0">Agent Prompt</tspan><tspan x="968.36" dy="20">Queue</tspan></text>
      <text x="968.36" y="346" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="968.36" dy="0">Serial FIFO of prompt</tspan><tspan x="968.36" dy="17">requests: probe at submit,</tspan><tspan x="968.36" dy="17">fresh context at start, one</tspan><tspan x="968.36" dy="17">running adapter, cancel,</tspan><tspan x="968.36" dy="17">shutdown. Touches no task</tspan><tspan x="968.36" dy="17">data.</tspan></text>
      </g><g data-element="tui.session"><rect x="948.3599999999999" y="676" width="212" height="159" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(1134.36 693) scale(0.667)" color="#759EB5" opacity="0.85"><title>Store</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 4 16 4 16 0V6M4 12c0 4 16 4 16 0"/></g></g>
      <text x="968.36" y="708" font-size="14" font-weight="600" fill="#292927"><tspan x="968.36" dy="0">Session State</tspan></text>
      <text x="968.36" y="732" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="968.36" dy="0">UI preference only (view,</tspan><tspan x="968.36" dy="17">collapsed set, panel</tspan><tspan x="968.36" dy="17">geometry, context filters)</tspan><tspan x="968.36" dy="17">under the XDG state dir; an</tspan><tspan x="968.36" dy="17">unreadable file yields the</tspan><tspan x="968.36" dy="17">zero value.</tspan></text>
      </g><g data-element="tui.embed"><rect x="50" y="481" width="256" height="163" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(280 498) scale(0.667)" color="#759EB5" opacity="0.85"><title>Adapter</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h14l-3-3m3 3-3 3M21 17H7l3-3m-3 3 3 3"/></g></g>
      <text x="70" y="513" font-size="14" font-weight="600" fill="#292927"><tspan x="70" dy="0">Public Embeddable API</tspan><tspan x="70" dy="20">(pkg/tui)</tspan></text>
      <text x="70" y="558" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="70" dy="0">Same runtime for a Go host:</tspan><tspan x="70" dy="17">namespaced session, suppressed</tspan><tspan x="70" dy="17">footer, quit and key hints,</tspan><tspan x="70" dy="17">exported bindings, Invoke by ID,</tspan><tspan x="70" dy="17">Close or Discard.</tspan></text>
      </g><g><rect x="355" y="568.5" width="109.03999999999998" height="53" rx="5" fill="#f8f8f6"/><text x="409.52" y="581.5" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="409.52" dy="0">Builds the same</tspan><tspan x="409.52" dy="15">runtime with</tspan><tspan x="409.52" dy="15">Embedded options</tspan></text></g><g><rect x="564.135" y="92" width="109.80999999999999" height="53" rx="5" fill="#f8f8f6"/><text x="619.04" y="105" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="619.04" dy="0">Exports bindings,</tspan><tspan x="619.04" dy="15">commands, and</tspan><tspan x="619.04" dy="15">contexts</tspan></text></g><g><rect x="778.55" y="568.5" width="116.29999999999997" height="38" rx="5" fill="#f8f8f6"/><text x="836.6999999999999" y="581.5" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="836.6999999999999" dy="0">Rebuilds rows from</tspan><tspan x="836.6999999999999" dy="15">one read</tspan></text></g><g><rect x="777.175" y="170" width="119.04999999999997" height="38" rx="5" fill="#f8f8f6"/><text x="836.6999999999999" y="183" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="836.6999999999999" dy="0">Dispatches keys by</tspan><tspan x="836.6999999999999" dy="15">focus context</tspan></text></g><g><rect x="774.04" y="365" width="125.31999999999996" height="53" rx="5" fill="#f8f8f6"/><text x="836.6999999999999" y="378" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="836.6999999999999" dy="0">Submits prompts and</tspan><tspan x="836.6999999999999" dy="15">checks the queue</tspan><tspan x="836.6999999999999" dy="15">each tick</tspan></text></g><g><rect x="787.68" y="761.5" width="98.03999999999998" height="53" rx="5" fill="#f8f8f6"/><text x="836.6999999999999" y="774.5" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="836.6999999999999" dy="0">Saves view,</tspan><tspan x="836.6999999999999" dy="15">collapse, panel,</tspan><tspan x="836.6999999999999" dy="15">contexts</tspan></text></g><g><rect x="1251.6399999999999" y="568.5" width="93.74999999999997" height="53" rx="5" fill="#f8f8f6"/><text x="1298.5149999999999" y="581.5" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="1298.5149999999999" dy="0">Paints frames,</tspan><tspan x="1298.5149999999999" dy="15">panels, forms,</tspan><tspan x="1298.5149999999999" dy="15">modals</tspan></text></g></g>
