  <title id="title">Tasks / Inside tasks-tui and the pkg/tui Surface</title><desc id="description">The standalone tasks-tui runtime, the shortcut registry, the agent prompt queue, session state, and the public pkg/tui surface a host such as Sidecar embeds.. Architecture structure.</desc>
