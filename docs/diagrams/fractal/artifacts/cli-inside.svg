<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description" data-theme="graphite" data-theme-appearance="light">
  <title id="title">Tasks / Inside the tasks CLI</title><desc id="description">Registry and dispatch tiers, the read, mutation, prompt, and maintenance verbs, and the merge-driver plumbing Git invokes. Which verbs use the facade and which call the store directly is stated on each card; the cli-mutation journey walks one write.. Architecture structure.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#85857f"/></marker></defs>
  <rect width="1920" height="1080" fill="#f8f8f6"/>
  <g font-family="Arial, Helvetica, sans-serif"><text x="96" y="58" font-size="12" letter-spacing="3" fill="#626b6f">FRACTAL / SYSTEM MODEL</text>
  <g data-export-layer="title"><text x="96" y="116" font-size="48" font-weight="600" fill="#292927"><tspan x="96" dy="0">Tasks / Inside the tasks CLI</tspan></text></g>
  <g data-export-layer="subtitle"><text x="96" y="170" font-size="19" font-weight="400" fill="#74746f"><tspan x="96" dy="0">Registry and dispatch tiers, the read, mutation, prompt, and maintenance verbs, and the merge-driver plumbing Git invokes. Which verbs use the facade and which call the store</tspan><tspan x="96" dy="26">directly is stated on each card; the cli-mutation journey walks one write.</tspan></text></g>
  <g data-export-layer="diagram" transform="translate(715.465 236) scale(0.65)"><g data-element="cli"><rect x="25" y="24" width="702.9799999999999" height="1079" rx="14" fill="#eeeeeb" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(701.98 41) scale(0.667)" color="#82A6B6" opacity="0.85"><title>Subsystem</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="13" height="13" rx="2"/><path d="M8 5V3h13v13h-2"/></g></g>
      <text x="49" y="54" font-size="14" font-weight="600" fill="#292927"><tspan x="49" dy="0">tasks CLI</tspan></text>
      <text x="45" y="78" font-size="12" font-weight="400" fill="#6d6d68"></text>
      </g><path d="M263,179 L279,179 L279,382.5 L484.1,382.5" fill="none" stroke="#85857f" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M263,179 L279,179 L279,594.5 L484.1,594.5" fill="none" stroke="#85857f" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M263,179 L484.1,179" fill="none" stroke="#85857f" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M263,179 L279,179 L279,796 L484.1,796" fill="none" stroke="#85857f" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M263,179 L279,179 L279,989 L484.1,989" fill="none" stroke="#85857f" stroke-width="1.5" marker-end="url(#arrow)"/><g data-element="cli.dispatch"><rect x="50" y="89" width="212" height="180" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(236 106) scale(0.667)" color="#82A6B6" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="70" y="121" font-size="14" font-weight="600" fill="#292927"><tspan x="70" dy="0">Registry &amp;</tspan><tspan x="70" dy="20">Dispatch</tspan></text>
      <text x="70" y="166" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="70" dy="0">Verb registry, aliases, help,</tspan><tspan x="70" dy="17">version. Only help, version,</tspan><tspan x="70" dy="17">merge-driver,</tspan><tspan x="70" dy="17">install-merge-driver run</tspan><tspan x="70" dy="17">before config; all else</tspan><tspan x="70" dy="17">needs a store.</tspan></text>
      </g><g data-element="cli.read"><rect x="485.09999999999997" y="301" width="212" height="163" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(671.1 318) scale(0.667)" color="#82A6B6" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="505.1" y="333" font-size="14" font-weight="600" fill="#292927"><tspan x="505.1" dy="0">Read &amp; Render</tspan><tspan x="505.1" dy="20">Commands</tspan></text>
      <text x="505.1" y="378" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="505.1" dy="0">list, show, agenda, next,</tspan><tspan x="505.1" dy="17">quadrants, inbox, projects,</tspan><tspan x="505.1" dy="17">links, id, workref: one</tspan><tspan x="505.1" dy="17">snapshot, taskquery, text</tspan><tspan x="505.1" dy="17">or --json. open shells out.</tspan></text>
      </g><g data-element="cli.mutate"><rect x="485.09999999999997" y="496" width="212" height="197" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(671.1 513) scale(0.667)" color="#82A6B6" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="505.1" y="528" font-size="14" font-weight="600" fill="#292927"><tspan x="505.1" dy="0">Mutation</tspan><tspan x="505.1" dy="20">Commands</tspan></text>
      <text x="505.1" y="573" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="505.1" dy="0">capture and project</tspan><tspan x="505.1" dy="17">complete, drop, reopen use</tspan><tspan x="505.1" dy="17">the facade; every other</tspan><tspan x="505.1" dy="17">verb calls the store</tspan><tspan x="505.1" dy="17">directly. Baselines guard</tspan><tspan x="505.1" dy="17">patches, changesets,</tspan><tspan x="505.1" dy="17">delete.</tspan></text>
      </g><g data-element="cli.prompt"><rect x="485.09999999999997" y="89" width="217.87999999999997" height="180" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(676.98 106) scale(0.667)" color="#82A6B6" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="505.1" y="121" font-size="14" font-weight="600" fill="#292927"><tspan x="505.1" dy="0">Agent Prompt</tspan><tspan x="505.1" dy="20">(tasks -p)</tspan></text>
      <text x="505.1" y="166" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="505.1" dy="0">Builds the system context,</tspan><tspan x="505.1" dy="17">runs the harness</tspan><tspan x="505.1" dy="17">synchronously in the data</tspan><tspan x="505.1" dy="17">directory, then prints git</tspan><tspan x="505.1" dy="17">diff of the task files. No</tspan><tspan x="505.1" dy="17">--json.</tspan></text>
      </g><g data-element="cli.maintenance"><rect x="485.09999999999997" y="725" width="212" height="142" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(671.1 742) scale(0.667)" color="#82A6B6" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="505.1" y="757" font-size="14" font-weight="600" fill="#292927"><tspan x="505.1" dy="0">Check &amp; Repair</tspan></text>
      <text x="505.1" y="781" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="505.1" dy="0">tasks check and repair over</tspan><tspan x="505.1" dy="17">the store lint and repair</tspan><tspan x="505.1" dy="17">entry points; both need a</tspan><tspan x="505.1" dy="17">configured store like any</tspan><tspan x="505.1" dy="17">other verb.</tspan></text>
      </g><g data-element="cli.mergedriver"><rect x="485.09999999999997" y="899" width="212" height="180" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(671.1 916) scale(0.667)" color="#82A6B6" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="505.1" y="931" font-size="14" font-weight="600" fill="#292927"><tspan x="505.1" dy="0">Merge Driver</tspan><tspan x="505.1" dy="20">Plumbing</tspan></text>
      <text x="505.1" y="976" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="505.1" dy="0">merge-driver, the early</tspan><tspan x="505.1" dy="17">verb Git invokes with stage</tspan><tspan x="505.1" dy="17">files, and</tspan><tspan x="505.1" dy="17">install-merge-driver, which</tspan><tspan x="505.1" dy="17">sets merge.tasksjsonl and</tspan><tspan x="505.1" dy="17">checks .gitattributes.</tspan></text>
      </g><g><rect x="322.16499999999996" y="388.5" width="102.76999999999998" height="38" rx="5" fill="#f8f8f6"/><text x="373.54999999999995" y="401.5" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="373.54999999999995" dy="0">Dispatches read</tspan><tspan x="373.54999999999995" dy="15">verbs</tspan></text></g><g><rect x="311" y="600.5" width="125.09999999999997" height="38" rx="5" fill="#f8f8f6"/><text x="373.54999999999995" y="613.5" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="373.54999999999995" dy="0">Dispatches mutation</tspan><tspan x="373.54999999999995" dy="15">verbs</tspan></text></g><g><rect x="328.435" y="185" width="90.22999999999999" height="23" rx="5" fill="#f8f8f6"/><text x="373.55" y="198" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="373.55" dy="0">Dispatches -p</tspan></text></g><g><rect x="319.03" y="802" width="109.03999999999998" height="38" rx="5" fill="#f8f8f6"/><text x="373.54999999999995" y="815" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="373.54999999999995" dy="0">Dispatches check</tspan><tspan x="373.54999999999995" dy="15">and repair</tspan></text></g><g><rect x="324.91499999999996" y="995" width="97.26999999999998" height="53" rx="5" fill="#f8f8f6"/><text x="373.54999999999995" y="1008" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="373.54999999999995" dy="0">Early dispatch,</tspan><tspan x="373.54999999999995" dy="15">before config</tspan><tspan x="373.54999999999995" dy="15">resolves</tspan></text></g></g>
