  <title id="title">Tasks / Agent Adapters</title><desc id="description">The provider seam: the harness contract, the built-in harnesses, the system context assembler, and prompt facts. The spawn-and-act path is the agent-prompt and tui-agent-queue journeys.. Architecture structure.</desc>
