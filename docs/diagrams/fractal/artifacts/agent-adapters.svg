 the</tspan><tspan x="214.65999999999997" dy="15">context, runs the</tspan><tspan x="214.65999999999997" dy="15">harness</tspan></text></g><g><rect x="152" y="228" width="125.31999999999995" height="53" rx="5" fill="#f8f8f6"/><text x="214.65999999999997" y="241" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="214.65999999999997" dy="0">Queued request:</tspan><tspan x="214.65999999999997" dy="15">fresh context, then</tspan><tspan x="214.65999999999997" dy="15">Start, Done, Cancel</tspan></text></g><g><rect x="152" y="431.5" width="125.31999999999995" height="53" rx="5" fill="#f8f8f6"/><text x="214.65999999999997" y="444.5" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="214.65999999999997" dy="0">Queued request:</tspan><tspan x="214.65999999999997" dy="15">fresh context, then</tspan><tspan x="214.65999999999997" dy="15">Start, Done, Cancel</tspan></text></g><g><rect x="659.1299999999999" y="388.5" width="103.53999999999999" height="53" rx="5" fill="#f8f8f6"/><text x="710.8999999999999" y="401.5" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="710.8999999999999" dy="0">Argv and</tspan><tspan x="710.8999999999999" dy="15">reachability per</tspan><tspan x="710.8999999999999" dy="15">provider</tspan></text></g><g><rect x="1110.1799999999998" y="424" width="121.79999999999997" height="68" rx="5" fill="#f8f8f6"/><text x="1171.08" y="437" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="1171.08" dy="0">Spawns the harness</tspan><tspan x="1171.08" dy="15">in the data</tspan><tspan x="1171.08" dy="15">directory; cancel</tspan><tspan x="1171.08" dy="15">via process group</tspan></text></g><g><rect x="1113.0399999999997" y="365" width="116.07999999999998" height="38" rx="5" fill="#f8f8f6"/><text x="1171.0799999999997" y="378" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="1171.0799999999997" dy="0">Reachability probe</tspan><tspan x="1171.0799999999997" dy="15">before every run</tspan></text></g><g><rect x="654.6199999999999" y="185" width="112.55999999999996" height="38" rx="5" fill="#f8f8f6"/><text x="710.8999999999999" y="198" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="710.8999999999999" dy="0">Current</tspan><tspan x="710.8999999999999" dy="15">environment block</tspan></text></g><g><rect x="1123.3249999999998" y="276" width="95.50999999999998" height="68" rx="5" fill="#f8f8f6"/><text x="1171.0799999999997" y="289" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="1171.0799999999997" dy="0">Injects</tspan><tspan x="1171.0799999999997" dy="15">user-approved</tspan><tspan x="1171.0799999999997" dy="15">defaults, read</tspan><tspan x="1171.0799999999997" dy="15">fresh</tspan></text></g></g>
