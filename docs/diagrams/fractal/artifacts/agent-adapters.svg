      <text x="45" y="78" font-size="12" font-weight="400" fill="#6d6d68"></text>
      </g><path d="M297.3,179 L505.86,179" fill="none" stroke="#85857f" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M297.3,382.5 L505.86,382.5" fill="none" stroke="#85857f" stroke-width="1.5" marker-end="url(#arrow)"/><g data-element="agent.llm"><rect x="50" y="97.5" width="246.29999999999993" height="163" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
