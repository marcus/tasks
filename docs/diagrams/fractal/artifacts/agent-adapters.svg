      <text x="70" y="129.5" font-size="14" font-weight="600" fill="#292927"><tspan x="70" dy="0">Harness Contract &amp;</tspan><tspan x="70" dy="20">Registry</tspan></text>
      <text x="70" y="174.5" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="70" dy="0">One Agent spawns any Harness:</tspan><tspan x="70" dy="17">RunSync (inherited stdio) for</tspan><tspan x="70" dy="17">tasks -p; Start, drain goroutine,</tspan><tspan x="70" dy="17">Done, Cancel for the TUI. Parses</tspan><tspan x="70" dy="17">LLM config itself.</tspan></text>
      </g><g data-element="agent.harnesses"><rect x="506.8599999999999" y="89" width="212" height="180" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(692.86 106) scale(0.667)" color="#9A91C4" opacity="0.85"><title>Adapter</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h14l-3-3m3 3-3 3M21 17H7l3-3m-3 3 3 3"/></g></g>
      <text x="526.86" y="121" font-size="14" font-weight="600" fill="#292927"><tspan x="526.86" dy="0">Built-in</tspan><tspan x="526.86" dy="20">Harnesses</tspan></text>
      <text x="526.86" y="166" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="526.86" dy="0">claude-cli, hermes,</tspan><tspan x="526.86" dy="17">cursor-cli in default order;</tspan><tspan x="526.86" dy="17">each supplies a binary, a</tspan><tspan x="526.86" dy="17">reachability probe (hermes</tspan><tspan x="526.86" dy="17">GETs Ollama /api/tags), and</tspan><tspan x="526.86" dy="17">argv.</tspan></text>
      </g><g data-element="agent.context"><rect x="70.71999999999997" y="292.5" width="225.57999999999996" height="180" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(270.3 309.5) scale(0.667)" color="#9A91C4" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="90.72" y="324.5" font-size="14" font-weight="600" fill="#292927"><tspan x="90.72" dy="0">System Context</tspan><tspan x="90.72" dy="20">Assembler</tspan></text>
      <text x="90.72" y="369.5" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="90.72" dy="0">One assembler for -p and the</tspan><tspan x="90.72" dy="17">TUI: embedded TASK_AGENT.md,</tspan><tspan x="90.72" dy="17">environment facts, the</tspan><tspan x="90.72" dy="17">installed tasks path (never</tspan><tspan x="90.72" dy="17">tasks-tui), agent-memory.md</tspan><tspan x="90.72" dy="17">(16 KiB).</tspan></text>
      </g><g data-element="agent.facts"><rect x="506.8599999999999" y="303" width="212" height="159" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(692.86 320) scale(0.667)" color="#9A91C4" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="526.86" y="335" font-size="14" font-weight="600" fill="#292927"><tspan x="526.86" dy="0">Prompt Facts</tspan></text>
      <text x="526.86" y="359" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="526.86" dy="0">Config-toggled, ordered</tspan><tspan x="526.86" dy="17">environment facts</tspan><tspan x="526.86" dy="17">(datetime, hostname) under</tspan><tspan x="526.86" dy="17">one heading; a failing</tspan><tspan x="526.86" dy="17">provider is omitted, never</tspan><tspan x="526.86" dy="17">fatal.</tspan></text>
      </g><g><rect x="349.80999999999995" y="124" width="103.53999999999999" height="53" rx="5" fill="#f8f8f6"/><text x="401.5799999999999" y="137" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="401.5799999999999" dy="0">Argv and</tspan><tspan x="401.5799999999999" dy="15">reachability per</tspan><tspan x="401.5799999999999" dy="15">provider</tspan></text></g><g><rect x="345.29999999999995" y="388.5" width="112.55999999999996" height="38" rx="5" fill="#f8f8f6"/><text x="401.5799999999999" y="401.5" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="401.5799999999999" dy="0">Current</tspan><tspan x="401.5799999999999" dy="15">environment block</tspan></text></g></g>
