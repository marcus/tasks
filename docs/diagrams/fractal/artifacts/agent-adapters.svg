      <g transform="translate(579.62 318) scale(0.667)" color="#9A91C4" opacity="0.85"><title>Adapter</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h14l-3-3m3 3-3 3M21 17H7l3-3m-3 3 3 3"/></g></g>
      <text x="379.32" y="333" font-size="14" font-weight="600" fill="#292927"><tspan x="379.32" dy="0">Harness Contract &amp;</tspan><tspan x="379.32" dy="20">Registry</tspan></text>
      <text x="379.32" y="378" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="379.32" dy="0">One Agent spawns any Harness:</tspan><tspan x="379.32" dy="17">RunSync (inherited stdio) for</tspan><tspan x="379.32" dy="17">tasks -p; Start, drain goroutine,</tspan><tspan x="379.32" dy="17">Done, Cancel for the TUI. Parses</tspan><tspan x="379.32" dy="17">LLM config itself.</tspan></text>
      </g><g data-element="agent.harnesses"><rect x="816.1799999999998" y="292.5" width="212" height="180" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(1002.18 309.5) scale(0.667)" color="#9A91C4" opacity="0.85"><title>Adapter</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h14l-3-3m3 3-3 3M21 17H7l3-3m-3 3 3 3"/></g></g>
      <text x="836.18" y="324.5" font-size="14" font-weight="600" fill="#292927"><tspan x="836.18" dy="0">Built-in</tspan><tspan x="836.18" dy="20">Harnesses</tspan></text>
      <text x="836.18" y="369.5" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="836.18" dy="0">claude-cli, hermes,</tspan><tspan x="836.18" dy="17">cursor-cli in default order;</tspan><tspan x="836.18" dy="17">each supplies a binary, a</tspan><tspan x="836.18" dy="17">reachability probe (hermes</tspan><tspan x="836.18" dy="17">GETs Ollama /api/tags), and</tspan><tspan x="836.18" dy="17">argv.</tspan></text>
      </g><g data-element="agent.context"><rect x="369.67999999999995" y="89" width="225.57999999999996" height="180" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(569.26 106) scale(0.667)" color="#9A91C4" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="389.68" y="121" font-size="14" font-weight="600" fill="#292927"><tspan x="389.68" dy="0">System Context</tspan><tspan x="389.68" dy="20">Assembler</tspan></text>
      <text x="389.68" y="166" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="389.68" dy="0">One assembler for -p and the</tspan><tspan x="389.68" dy="17">TUI: embedded TASK_AGENT.md,</tspan><tspan x="389.68" dy="17">environment facts, the</tspan><tspan x="389.68" dy="17">installed tasks path (never</tspan><tspan x="389.68" dy="17">tasks-tui), agent-memory.md</tspan><tspan x="389.68" dy="17">(16 KiB).</tspan></text>
      </g><g data-element="agent.facts"><rect x="816.1799999999998" y="99.5" width="212" height="159" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(1002.18 116.5) scale(0.667)" color="#9A91C4" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="836.18" y="131.5" font-size="14" font-weight="600" fill="#292927"><tspan x="836.18" dy="0">Prompt Facts</tspan></text>
      <text x="836.18" y="155.5" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="836.18" dy="0">Config-toggled, ordered</tspan><tspan x="836.18" dy="17">environment facts</tspan><tspan x="836.18" dy="17">(datetime, hostname) under</tspan><tspan x="836.18" dy="17">one heading; a failing</tspan><tspan x="836.18" dy="17">provider is omitted, never</tspan><tspan x="836.18" dy="17">fatal.</tspan></text>
