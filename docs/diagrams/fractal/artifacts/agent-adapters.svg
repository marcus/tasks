  <g data-export-layer="subtitle"><text x="96" y="170" font-size="19" font-weight="400" fill="#74746f"><tspan x="96" dy="0">The provider seam: the harness contract, the built-in harnesses, the system context assembler, and prompt facts. The spawn-and-act path is the agent-prompt and</tspan><tspan x="96" dy="26">tui-agent-queue journeys.</tspan></text></g>
