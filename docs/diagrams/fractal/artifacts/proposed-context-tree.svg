      <text x="533.04" y="601" font-size="14" font-weight="600" fill="#292927"><tspan x="533.04" dy="0">Runtime &amp; Model</tspan><tspan x="533.04" dy="20">Loop</tspan></text>
      <text x="533.04" y="646" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="533.04" dy="0">Builds the facade over a</tspan><tspan x="533.04" dy="17">host-wired writer store;</tspan><tspan x="533.04" dy="17">the model re-reads rows</tspan><tspan x="533.04" dy="17">when the file stat changes</tspan><tspan x="533.04" dy="17">or the local date rolls.</tspan></text>
      </g><g data-element="tui.views"><rect x="969.4299999999998" y="284" width="212.13999999999996" height="163" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
