      <text x="989.43" y="316" font-size="14" font-weight="600" fill="#292927"><tspan x="989.43" dy="0">Views, Rows &amp; Task</tspan><tspan x="989.43" dy="20">Panel</tspan></text>
      <text x="989.43" y="361" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="989.43" dy="0">Agenda, Next, Quadrants,</tspan><tspan x="989.43" dy="17">Inbox, Projects, Outline</tspan><tspan x="989.43" dy="17">rows, list actions, the</tspan><tspan x="989.43" dy="17">read-first task panel, and</tspan><tspan x="989.43" dy="17">save-on-blur edits.</tspan></text>
      </g><g data-element="tui.shortcuts"><rect x="948.3599999999999" y="691" width="254.27999999999992" height="146" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(1176.64 708) scale(0.667)" color="#759EB5" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="968.36" y="723" font-size="14" font-weight="600" fill="#292927"><tspan x="968.36" dy="0">Shortcut Registry &amp;</tspan><tspan x="968.36" dy="20">Commands</tspan></text>
      <text x="968.36" y="768" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="968.36" dy="0">Declarative registry of every key</tspan><tspan x="968.36" dy="17">action with focus context and</tspan><tspan x="968.36" dy="17">availability; exported to hosts and</tspan><tspan x="968.36" dy="17">rendered in help.</tspan></text>
      </g><g data-element="tui.chrome"><rect x="1413.4199999999998" y="89" width="232.29999999999993" height="163" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(1619.72 106) scale(0.667)" color="#759EB5" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="1433.42" y="121" font-size="14" font-weight="600" fill="#292927"><tspan x="1433.42" dy="0">Terminal Primitives &amp;</tspan><tspan x="1433.42" dy="20">Theme</tspan></text>
      <text x="1433.42" y="166" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="1433.42" dy="0">Styler seam over term/: theme</tspan><tspan x="1433.42" dy="17">slots, ANSI width and wrap,</tspan><tspan x="1433.42" dy="17">borders, buttons, key chips,</tspan><tspan x="1433.42" dy="17">scroll regions, status line,</tspan><tspan x="1433.42" dy="17">modals, forms.</tspan></text>
