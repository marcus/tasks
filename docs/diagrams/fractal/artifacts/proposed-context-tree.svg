      <text x="70" y="714.5" font-size="14" font-weight="600" fill="#292927"><tspan x="70" dy="0">Public Embeddable API</tspan><tspan x="70" dy="20">(pkg/tui)</tspan></text>
      <text x="70" y="759.5" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="70" dy="0">Same runtime for a Go host:</tspan><tspan x="70" dy="17">namespaced session, suppressed</tspan><tspan x="70" dy="17">footer, quit and key hints,</tspan><tspan x="70" dy="17">exported bindings, Invoke by ID,</tspan><tspan x="70" dy="17">Close or Discard.</tspan></text>
