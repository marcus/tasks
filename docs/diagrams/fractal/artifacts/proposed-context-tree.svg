      <text x="968.36" y="511" font-size="14" font-weight="600" fill="#292927"><tspan x="968.36" dy="0">Agent Prompt</tspan><tspan x="968.36" dy="20">Queue</tspan></text>
      <text x="968.36" y="556" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="968.36" dy="0">Serial FIFO of prompt</tspan><tspan x="968.36" dy="17">requests: probe at submit,</tspan><tspan x="968.36" dy="17">fresh context at start, one</tspan><tspan x="968.36" dy="17">running adapter, cancel,</tspan><tspan x="968.36" dy="17">shutdown. Touches no task</tspan><tspan x="968.36" dy="17">data.</tspan></text>
      </g><g data-element="tui.session"><rect x="948.3599999999999" y="93" width="212" height="159" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(1134.36 110) scale(0.667)" color="#759EB5" opacity="0.85"><title>Store</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 4 16 4 16 0V6M4 12c0 4 16 4 16 0"/></g></g>
      <text x="968.36" y="125" font-size="14" font-weight="600" fill="#292927"><tspan x="968.36" dy="0">Session State</tspan></text>
      <text x="968.36" y="149" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="968.36" dy="0">UI preference only (view,</tspan><tspan x="968.36" dy="17">collapsed set, panel</tspan><tspan x="968.36" dy="17">geometry, context filters)</tspan><tspan x="968.36" dy="17">under the XDG state dir; an</tspan><tspan x="968.36" dy="17">unreadable file yields the</tspan><tspan x="968.36" dy="17">zero value.</tspan></text>
      </g><g data-element="tui.embed"><rect x="50" y="682.5" width="256" height="163" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
