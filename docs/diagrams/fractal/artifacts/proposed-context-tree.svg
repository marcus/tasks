  <title id="title">Tasks / Proposed: Subtasks in Context-Filtered Views</title><desc id="description">Planned TUI work from docs/plans/active: a matching descendant whose parent lacks the context keeps its ancestor chain, reusing the shared tree builder outside this focus. Sidecar&apos;s mapped-project capture defaults are the other open proposal, also outside this focus.. Architecture structure.</desc>
