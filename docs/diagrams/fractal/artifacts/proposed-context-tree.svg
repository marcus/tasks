  <g data-export-layer="subtitle"><text x="96" y="170" font-size="19" font-weight="400" fill="#74746f"><tspan x="96" dy="0">Planned TUI work from docs/plans/active: a matching descendant whose parent lacks the context keeps its ancestor chain, reusing the shared tree builder outside this focus.</tspan><tspan x="96" dy="26">Sidecar&apos;s mapped-project capture defaults are the other open proposal, also outside this focus.</tspan></text></g>
