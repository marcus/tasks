      <g transform="translate(1632.46 301) scale(0.667)" color="#759EB5" opacity="0.85"><title>Proposed component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="1433.42" y="316" font-size="14" font-weight="600" fill="#292927"><tspan x="1433.42" dy="0">Context-Aware</tspan><tspan x="1433.42" dy="20">Subtree Rows</tspan></text>
      <text x="1433.42" y="361" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="1433.42" dy="0">Planned: a matching descendant</tspan><tspan x="1433.42" dy="17">whose parent lacks the context</tspan><tspan x="1433.42" dy="17">keeps its minimal ancestor chain;</tspan><tspan x="1433.42" dy="17">direct matches already keep the</tspan><tspan x="1433.42" dy="17">tree.</tspan></text>
      </g><g><rect x="355" y="595.5" width="109.03999999999998" height="53" rx="5" fill="#f8f8f6"/><text x="409.52" y="608.5" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="409.52" dy="0">Builds the same</tspan><tspan x="409.52" dy="15">runtime with</tspan><tspan x="409.52" dy="15">Embedded options</tspan></text></g><g><rect x="564.135" y="770" width="109.80999999999999" height="53" rx="5" fill="#f8f8f6"/><text x="619.04" y="783" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="619.04" dy="0">Exports bindings,</tspan><tspan x="619.04" dy="15">commands, and</tspan><tspan x="619.04" dy="15">contexts</tspan></text></g><g><rect x="778.55" y="371.5" width="116.29999999999997" height="38" rx="5" fill="#f8f8f6"/><text x="836.6999999999999" y="384.5" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="836.6999999999999" dy="0">Rebuilds rows from</tspan><tspan x="836.6999999999999" dy="15">one read</tspan></text></g><g><rect x="777.175" y="656.5" width="119.04999999999997" height="38" rx="5" fill="#f8f8f6"/><text x="836.6999999999999" y="669.5" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="836.6999999999999" dy="0">Dispatches keys by</tspan><tspan x="836.6999999999999" dy="15">focus context</tspan></text></g><g><rect x="774.04" y="575" width="125.31999999999996" height="53" rx="5" fill="#f8f8f6"/><text x="836.6999999999999" y="588" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="836.6999999999999" dy="0">Submits prompts and</tspan><tspan x="836.6999999999999" dy="15">checks the queue</tspan><tspan x="836.6999999999999" dy="15">each tick</tspan></text></g><g><rect x="787.68" y="178.5" width="98.03999999999998" height="53" rx="5" fill="#f8f8f6"/><text x="836.6999999999999" y="191.5" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="836.6999999999999" dy="0">Saves view,</tspan><tspan x="836.6999999999999" dy="15">collapse, panel,</tspan><tspan x="836.6999999999999" dy="15">contexts</tspan></text></g><g><rect x="1261.155" y="115.5" width="93.74999999999997" height="53" rx="5" fill="#f8f8f6"/><text x="1308.03" y="128.5" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="1308.03" dy="0">Paints frames,</tspan><tspan x="1308.03" dy="15">panels, forms,</tspan><tspan x="1308.03" dy="15">modals</tspan></text></g><g><rect x="1251.6399999999999" y="371.5" width="112.77999999999999" height="53" rx="5" fill="#f8f8f6"/><text x="1308.03" y="384.5" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="1308.03" dy="0">Builds rows under</tspan><tspan x="1308.03" dy="15">an active context</tspan><tspan x="1308.03" dy="15">filter</tspan></text></g></g>
