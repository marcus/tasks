                      name: { type: string }
                      tasks:
                        type: array
                        items: { $ref: "#/components/schemas/Task" }
                      groups:
                        description: Optional grouping metadata (view-specific).
                        type: array
                        items:
                          type: object
                          additionalProperties: true
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
              examples:
                agenda:
                  value:
                    data:
                      name: "agenda"
                      tasks:
                        - id: "3c4d5e6f"
                          revision: "v1.opaque-own.opaque-location.opaque-lifecycle"
                          source: "live"
                          parent_id: null
                          section_id: "9f8e7d6c"
                          depth: 0
                          state: "NEXT"
                          priority: "A"
                          title: "Email the vendor about the renewal"
                          contexts: ["@desk"]
