  /tasks/{id}/reject:
    post:
      tags: [tasks]
      operationId: rejectTaskProposal
      summary: Decline a proposed task into CANCELLED.
      description: |
        Atomically transitions a live PROPOSED task to CANCELLED and stamps its
        closed date. An empty body keeps the historical no-body contract; an
        optional JSON body may supply `notes` (string or ordered list of
        strings) as withdrawal rationale appended to the task body in the same
        write — the HTTP mirror of repeatable CLI `reject --note`. Requires the
        proposal's current ETag in `If-Match`. Proposed descendants must be
        decided first.
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - $ref: "#/components/parameters/IfMatch"
