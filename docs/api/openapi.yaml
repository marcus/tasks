                          scheduled_time: null
                          deadline: "2026-07-20"
                          deadline_time: null
                          available: true
                          availability_reason: "available"
                          availability_blocker_id: null
                          available_at: null
                          recurrence: null
                          recurrence_human: null
                          lead: null
                          lead_human: null
                          lead_opens: null
                          lead_opens_at: null
                          body: ["Captured 2026-07-14."]
                          closed: null
                          rejected: null
                          archived: false
                          project: "Work"
                          child_count: 0
                          descendant_count: 0
                          delegation: null
                          formal_links: []
                          links: []
                    meta:
                      store_revision: "s1.6f2a9c0b"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/StoreInvalid"

  /history:
    get:
      tags: [history]
      operationId: getHistory
      summary: Peek at the next undo and redo labels.
      description: |
        Non-mutating. Returns the next undo and redo labels (or null when a
        direction is empty) plus the `store_revision` they apply to, so the
        client can render labeled controls and supply the right precondition to
        undo/redo.
      responses:
        "200":
          description: Undo/redo peek.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [undo, redo, store_revision]
                    properties:
                      undo:
                        type: [string, "null"]
                        description: Label of the step a subsequent undo would revert.
                      redo:
                        type: [string, "null"]
                        description: Label of the step a subsequent redo would reapply.
                      store_revision:
                        type: string
                        description: The revision undo/redo must be conditioned on.
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
              examples:
                default:
                  value:
                    data:
                      undo: "capture: Weekly review"
                      redo: null
                      store_revision: "s1.6f2a9c0b"
                    meta:
                      store_revision: "s1.6f2a9c0b"
        "503":
          $ref: "#/components/responses/StoreInvalid"

  /history/undo:
    post:
      tags: [history]
      operationId: undo
      summary: Apply the next undo step under a store-revision precondition.
      description: |
        Reverts the shared journal's next undo step. The request must carry the
        `store_revision` the client last saw; a mismatch returns `409` instead
        of undoing another surface's newer write.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HistoryStepRequest" }
            examples:
              default:
                value:
                  store_revision: "s1.6f2a9c0b"
      responses:
        "200":
          description: The undo was applied.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HistoryStepResponse" }
              examples:
                undone:
                  value:
                    data:
                      label: "capture: Weekly review"
                      store_revision: "s1.5e1a2b3c"
                    meta:
                      store_revision: "s1.5e1a2b3c"
        "409":
          $ref: "#/components/responses/HistoryConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/StoreInvalid"

  /history/redo:
    post:
      tags: [history]
      operationId: redo
      summary: Apply the next redo step under a store-revision precondition.
      description: |
        Reapplies the shared journal's next redo step under the same
        `store_revision` precondition as undo.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HistoryStepRequest" }
            examples:
              default:
                value:
                  store_revision: "s1.5e1a2b3c"
      responses:
        "200":
          description: The redo was applied.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HistoryStepResponse" }
              examples:
                redone:
                  value:
                    data:
                      label: "capture: Weekly review"
                      store_revision: "s1.6f2a9c0b"
                    meta:
                      store_revision: "s1.6f2a9c0b"
        "409":
          $ref: "#/components/responses/HistoryConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/StoreInvalid"

  /archive-preview:
    get:
      tags: [archive]
      operationId: archivePreview
      summary: Preview the next archive sweep.
      description: |
        Returns the safe sweep preview (roots, descendant counts, blocked
        roots) and an opaque `fingerprint`. A subsequent sweep must present the
        same fingerprint.
      responses:
        "200":
          description: Sweep preview and fingerprint.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [fingerprint, roots]
                    properties:
                      fingerprint:
                        type: string
                        description: Opaque token the sweep must match.
                      roots:
                        type: integer
                        description: Number of closed roots the sweep would move.
                      descendants:
                        type: integer
                      blocked:
                        type: integer
                        description: Closed roots whose subtree still holds open work.
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
              examples:
                default:
                  value:
                    data:
                      fingerprint: "sweep.a1b2c3"
                      roots: 4
                      descendants: 6
                      blocked: 0
                    meta:
                      store_revision: "s1.6f2a9c0b"
        "503":
          $ref: "#/components/responses/StoreInvalid"

  /archive-sweeps:
    post:
      tags: [archive]
      operationId: createArchiveSweep
      summary: Sweep closed tasks into the archive when the preview still matches.
      description: |
        Moves the previewed closed tasks into `archive.jsonl` as one journal
        entry, but only when the supplied `fingerprint` still matches the
        current preview. A changed preview returns `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fingerprint]
              additionalProperties: false
              properties:
                fingerprint:
                  type: string
                  description: The fingerprint returned by `/archive-preview`.
            examples:
              default:
                value:
                  fingerprint: "sweep.a1b2c3"
      responses:
        "200":
          description: Sweep applied. (200, not 201 — a sweep is an action with no addressable created resource.)
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [swept]
                    properties:
                      swept:
                        type: integer
                        description: Number of tasks moved to the archive.
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
              examples:
                default:
                  value:
                    data:
                      swept: 10
                    meta:
                      store_revision: "s1.9c3d4e5f"
        "409":
          description: The preview changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              examples:
                changed_preview:
                  value:
                    error:
                      code: "conflict"
                      message: "The archive preview changed; refetch it and retry."
                      details: { fingerprint: "sweep.a1b2c3" }
                      request_id: "req_8c3e"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/StoreInvalid"

  /events:
    get:
      tags: [events]
      operationId: streamEvents
      summary: Server-sent store-change invalidation stream.
      description: |
        A `text/event-stream` that emits a `store.changed` event whenever a CLI,
        TUI, or API write replaces either file. The event payload carries the
        new global `store_revision`; clients then refetch affected queries with
        ordinary GETs. This is invalidation, not event sourcing.

        SSE is deferred behind conditional polling of `/meta` in v1: every open
        SSE response holds one server goroutine for its lifetime, so
        the streaming path needs a sized thread budget before it ships. Polling
        `/meta` (comparing `store_revision`) is the v1 default.
      responses:
        "200":
          description: An event stream.
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  SSE frames. Each `store.changed` event has a `data:` line whose
                  JSON body is `{ "store_revision": "..." }`.
              examples:
                store_changed:
                  summary: One store.changed frame.
                  value: |
                    event: store.changed
                    data: {"store_revision":"s1.8b2c3d4e"}
        "503":
          $ref: "#/components/responses/StoreInvalid"

  /healthz:
    servers:
      - url: http://127.0.0.1:{port}
        variables:
          port: { default: "4747" }
    get:
      tags: [health]
      operationId: liveness
      summary: Liveness probe (outside /api/v1).
      description: Proves the process is serving. Does not touch the Store.
      responses:
        "200":
          description: The process is live.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
              examples:
                default:
                  value: { status: "ok" }
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /readyz:
    servers:
      - url: http://127.0.0.1:{port}
        variables:
          port: { default: "4747" }
    get:
      tags: [health]
      operationId: readiness
      summary: Readiness probe (outside /api/v1).
      description: |
        Uses the same coherent checked-read boundary as API resources and
        reports only a safe summary. No filesystem paths are returned.
      responses:
        "200":
          description: The backing store is structurally valid and ready.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ready] }
              examples:
                default:
                  value: { status: "ready" }
        "503":
          description: The backing store failed its structural check.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              examples:
                store_invalid:
                  value:
                    error:
                      code: "store_invalid"
                      message: "The task list failed structural validation."
                      details: {}
                      request_id: "req_9d4f"
                unsupported_schema_version:
                  value:
                    error:
                      code: "unsupported_schema_version"
                      message: "The task store declares a schema version this build does not implement."
                      details: { supported_version: 2 }
                      request_id: "req_9d5a"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "422":
          $ref: "#/components/responses/ValidationFailed"

components:
  parameters:
    TaskId:
      name: id
      in: path
      required: true
      description: Stable eight-hex task id.
      schema: { $ref: "#/components/schemas/TaskId" }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: |
        The opaque task `revision` (ETag) the client last saw. Required on
        PATCH, DELETE, and every task action (approve, reject, unreject, delegate,
        undelegate, claim, release, work_ref). A missing header is `428`; a
        stale value is `412`.
      schema: { type: string }

  responses:
    MalformedRequest:
      description: Malformed JSON or an otherwise unparseable request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          examples:
            malformed:
              value:
                error:
                  code: "malformed_request"
                  message: "The request body is not valid JSON."
                  details: {}
                  request_id: "req_1a2b"
    UnsupportedMediaType:
      description: A mutation body was sent with a non-JSON content type.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          examples:
            unsupported:
              value:
                error:
                  code: "unsupported_media_type"
                  message: "Request bodies must be application/json."
                  details: {}
                  request_id: "req_2b3c"
    ForbiddenOrigin:
      description: A browser mutation supplied an Origin outside the expected loopback origins.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          examples:
            forbidden:
              value:
                error:
                  code: "forbidden_origin"
                  message: "This origin is not allowed to mutate tasks."
                  details: {}
                  request_id: "req_2c3d"
    PayloadTooLarge:
      description: The JSON request body exceeded the 65536-byte limit.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          examples:
            too_large:
              value:
                error:
                  code: "payload_too_large"
                  message: "The request body is too large."
                  details: {}
                  request_id: "req_2d3e"
    NotFound:
      description: No such task in the requested source.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          examples:
            not_found:
              value:
                error:
                  code: "not_found"
                  message: "No task with that id."
                  details: {}
                  request_id: "req_3c4d"
    StaleRevision:
      description: |
        The supplied `If-Match` no longer matches the task's current revision.
        The current resource is included when it is safe to disclose it.
      headers:
        ETag:
          description: The task's current opaque revision.
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          examples:
            stale:
              value:
                error:
                  code: "stale_revision"
                  message: "The task changed after it was loaded."
                  details:
                    current:
                      id: "3c4d5e6f"
                      revision: "v1.newer-own.opaque-location.opaque-lifecycle"
                      source: "live"
                      parent_id: null
                      section_id: "9f8e7d6c"
                      depth: 0
                      state: "NEXT"
                      priority: "B"
                      title: "Email the vendor about the renewal"
                      contexts: ["@desk"]
                      tags: ["billing"]
                      deferred: false
                      scheduled: "2026-07-20"
                      scheduled_time: null
                      deadline: null
                      deadline_time: null
                      available: false
                      availability_reason: "scheduled"
                      availability_blocker_id: "3c4d5e6f"
                      available_at: null
                      recurrence: null
                      recurrence_human: null
                      lead: null
                      lead_human: null
                      lead_opens: null
                      lead_opens_at: null
                      body: ["Captured 2026-07-14."]
                      closed: null
                      rejected: null
                      archived: false
                      project: "Work"
                      child_count: 0
                      descendant_count: 0
                      delegation: null
                      formal_links: []
                      links: []
                  request_id: "req_4d5e"
    ClaimConflict:
      description: |
        A lost delegation race, deliberately distinct from `412`
        / `stale_revision`. `412` means the client's view of the task was out of
        date and it should refetch and decide again; `409` / `claim_conflict`
        means the view was current and the marker is simply held by someone
        else — another worker already claimed it, the claim being released or
        written to belongs to a different worker, or the owner must revoke
        before re-delegating. `details.holder` names the current holder (null in
        the one case where a worker acts on an unclaimed marker) and
        `details.at` is the timestamp of the transition that beat this request.
        The losing caller picks another task; it does not retry.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          examples:
            claimed:
              value:
                error:
                  code: "claim_conflict"
                  message: "already claimed by claude-code/claude-opus-5/9a11d0c2 at 2026-07-27T18:04:11Z"
                  details:
                    id: "3c4d5e6f"
                    action: "claim"
                    holder: "claude-code/claude-opus-5/9a11d0c2"
                    at: "2026-07-27T18:04:11Z"
                  request_id: "req_7a8b"
    MissingPrecondition:
      description: A required `If-Match` header was absent.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          examples:
            missing:
              value:
                error:
                  code: "missing_precondition"
                  message: "This write requires an If-Match header."
                  details: {}
                  request_id: "req_5e6f"
    ValidationFailed:
      description: |
        A semantic value was invalid, or an unknown field was sent. `details`
        carries per-field messages when available.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          examples:
            validation:
              value:
                error:
                  code: "validation_failed"
                  message: "One or more fields are invalid."
                  details:
                    fields:
                      priority: ["priority must be A, B, C, or null"]
                      unknown: ["unknown editable field :colour"]
                  request_id: "req_6f7a"
    HistoryConflict:
      description: |
        The step cannot be applied: the supplied `store_revision` no longer
        matches (another surface wrote since it was observed), there is no
        step in that direction, or the journal refused the step because the
        files were edited out of band. `details.reason` distinguishes
        `stale_store_revision`, `empty`, and `journal_conflict` for history
        conflicts.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          examples:
            conflict:
              value:
                error:
                  code: "conflict"
                  message: "The store changed since that revision; refetch and retry."
                  details:
                    reason: "stale_store_revision"
                    store_revision: "s1.6f2a9c0b"
                  request_id: "req_7a8b"
            empty:
              value:
                error:
                  code: "conflict"
                  message: "Nothing to undo."
                  details: { reason: "empty" }
                  request_id: "req_1d2e"
    StoreInvalid:
      description: |
        The operation could not proceed against the backing store: the store is
        structurally invalid (`store_invalid`, including a write that failed
        post-write validation and was rolled back), the store declares a schema
        version this build does not implement (`unsupported_schema_version` —
        refused on read and on write, with nothing written and no conversion
        offered), or a write failed for an environmental reason and was rolled
        back (`unavailable`). A live store lock that cannot be acquired within
        5s is also `unavailable`; the message then names the holding pid
        and when it took the lock.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          examples:
            store_invalid:
              value:
                error:
                  code: "store_invalid"
                  message: "The task list failed structural validation."
                  details: {}
                  request_id: "req_8b9c"
            unsupported_schema_version:
              value:
                error:
                  code: "unsupported_schema_version"
                  message: "The task store declares a schema version this build does not implement."
                  details: { supported_version: 2 }
                  request_id: "req_8b9e"
            unavailable:
              value:
                error:
                  code: "unavailable"
                  message: "The write failed and was rolled back; retry."
                  details: {}
                  request_id: "req_2f4d"
  examples:
    TaskResource:
      summary: A representative task resource.
      value:
        id: "3c4d5e6f"
        revision: "v1.opaque-own.opaque-location.opaque-lifecycle"
        source: "live"
        parent_id: null
        section_id: "9f8e7d6c"
        depth: 0
        state: "NEXT"
        priority: "A"
        title: "Email the vendor about the renewal"
        contexts: ["@desk"]
        tags: ["billing"]
        deferred: false
        scheduled: "2026-07-20"
        scheduled_time: null
        deadline: null
        deadline_time: null
        available: false
        availability_reason: "scheduled"
        availability_blocker_id: "3c4d5e6f"
        available_at: null
        recurrence: null
        recurrence_human: null
        lead: null
        lead_human: null
        lead_opens: null
        lead_opens_at: null
        body: ["Captured 2026-07-14.", "Confirm the seat count first."]
        closed: null
        rejected: null
        archived: false
        project: "Work"
        child_count: 0
        descendant_count: 0
        delegation: null
        formal_links: []
        links:
          - system: "github"
            url: "https://github.com/acme/app/issues/12"
            label: "acme/app#12"
            source: "body"

  schemas:
    TaskId:
      type: string
      pattern: "^[0-9a-f]{8}$"
      description: Stable eight-hex task or section id.
      example: "3c4d5e6f"

    State:
      type: string
      enum: [PROPOSED, INBOX, TODO, NEXT, WAITING, DONE, CANCELLED]

    Priority:
      type: [string, "null"]
      enum: [A, B, C, null]
      description: Task priority, or null when unset.

    IsoDate:
      type: [string, "null"]
      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
      description: ISO YYYY-MM-DD date, or null.

    IsoDateOnly:
      type: string
      pattern: "^[0-9]{4,}-[0-9]{2}-[0-9]{2}$"
      description: |
        A non-null ISO YYYY-MM-DD date. Unlike a stored date this one is only
        projected, never written, so an absurd interval (`9999y:07-04`) may
        push it past four digits; the store would refuse such a schedule.

    TaskTimeInput:
      type: [object, "null"]
      description: Optional civil clock metadata. Null converts the paired date to all-day.
      required: [local]
      additionalProperties: false
      properties:
        local:
          type: string
          pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9]$"
        timezone:
          type: [string, "null"]
          description: IANA zone id; null or absent means floating in the server evaluation zone.
        fold:
          type: integer
          enum: [0, 1]
          default: 0

    TaskTime:
      type: [object, "null"]
      readOnly: true
      required: [local, timezone, fold, effective_timezone, instant]
      additionalProperties: false
      properties:
        local: { type: string, pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9]$" }
        timezone: { type: [string, "null"] }
        fold: { type: integer, enum: [0, 1] }
        effective_timezone: { type: string }
        instant: { type: string, format: date-time }

    FormalLink:
      type: object
      required: [url]
      additionalProperties: false
      properties:
        url:
          type: string
          maxLength: 2000
          pattern: "^https?://"
        label:
          type: string
          minLength: 1
          maxLength: 200

    Link:
      type: object
      description: A derived, read-only member of the task's openable link union.
      required: [system, url, label, source]
      additionalProperties: false
      properties:
        system:
          type: [string, "null"]
          description: Classified system (slack, jira, github, …) or host fallback.
        url:
          type: string
        label:
          type: [string, "null"]
        source:
          type: string
          enum: [formal, title, body]

    ResponseMeta:
      type: object
      required: [store_revision]
      additionalProperties: false
      properties:
        store_revision:
          type: string
          description: |
            Opaque global change token. A refresh signal for browser queries,
            not a per-task write precondition.

    Meta:
      type: object
      description: Server capabilities and config-derived vocabularies. No paths.
      required: [api_version, server_mode, states, proposed_states, open_states,
                 closed_states, priorities, delegation_kinds, delegation_modes,
                 delegation_statuses, max_depth, urgent_days,
                 timezone, time_format, tzdb_version, temporal_precision]
      additionalProperties: false
      properties:
        api_version: { type: string }
        server_mode:
          type: string
          enum: [loopback]
        states:
          type: array
          items: { $ref: "#/components/schemas/State" }
        proposed_states:
          type: array
          items: { $ref: "#/components/schemas/State" }
        open_states:
          type: array
          items: { $ref: "#/components/schemas/State" }
        closed_states:
          type: array
          items: { $ref: "#/components/schemas/State" }
        priorities:
          type: array
          items: { type: string, enum: [A, B, C] }
        delegation_kinds:
          type: array
          description: Who a task can be handed to.
          items: { $ref: "#/components/schemas/DelegationKind" }
        delegation_modes:
          type: array
          description: |
            Agent authority levels, narrowest first. Only the owner sets or
            widens a mode; a worker never promotes its own.
          items: { $ref: "#/components/schemas/DelegationMode" }
        delegation_statuses:
          type: array
          description: Delegation statuses across both kinds.
          items: { $ref: "#/components/schemas/DelegationStatus" }
        max_depth:
          type: integer
          description: Maximum nesting depth (max_depth config / TASKS_MAX_DEPTH).
        urgent_days:
          type: integer
          description: Deadline horizon used by the quadrants view.
        timezone: { type: string }
        time_format: { type: integer, enum: [12, 24] }
        tzdb_version: { type: string }
        temporal_precision: { type: string, enum: [minute] }
        capabilities:
          type: object
          description: |
            Feature flags for the running server. A capability is true only when
            its backing endpoints are routed by this server, not merely when the
            store supports the operation. undo/redo/archive_sweep are false until
            the manager endpoints (/history, /archive-sweeps) are implemented.
          additionalProperties: { type: boolean }

    Section:
      type: object
      description: A live section (project heading).
      required: [id, title, parent_id]
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/TaskId" }
        title: { type: string }
        parent_id:
          oneOf:
            - { $ref: "#/components/schemas/TaskId" }
            - { type: "null" }

    Project:
      type: object
      description: |
        A project or area rolled up over its open, non-deferred tasks. A project
        is a section under the top-level "Projects" heading; an area is another
        top-level section holding open work. Every field is always present;
        `parent_id`, `next_date`, and `body` are null when absent. No physical
        `line`.
      required:
        - id
        - title
        - parent_id
        - kind
        - open_count
        - next_count
        - next_date
        - next_time
        - next_at
        - stuck
        - held_count
        - body
        - task_ids
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/TaskId" }
        title: { type: string }
        parent_id:
          description: The "Projects" heading id for a project, null for a top-level area.
          oneOf:
            - { $ref: "#/components/schemas/TaskId" }
            - { type: "null" }
        kind:
          type: string
          enum: [project, area]
        open_count:
          type: integer
          minimum: 0
          description: Open, non-deferred descendant tasks at any depth.
        next_count:
          type: integer
          minimum: 0
          description: How many of the open tasks are NEXT actions.
        next_date:
          allOf:
            - { $ref: "#/components/schemas/IsoDate" }
          description: Soonest deadline-or-scheduled date across the open tasks, or null.
        next_time:
          $ref: "#/components/schemas/TaskTime"
        next_at:
          type: [string, "null"]
          format: date-time
        stuck:
          type: boolean
          description: True when the project/area has no open NEXT action (including when empty).
        held_count:
          type: integer
          minimum: 0
          description: >
            Open descendant tasks excluded from the rollup because they are
            deferred/held (own or inherited hold). Archive counts these as open
            work: `open_count + held_count > 0` blocks it without `force=true`.
        body:
          type: [string, "null"]
          description: The section's body note, or null.
        task_ids:
          type: array
          description: Ids of the rolled-up open, non-deferred tasks in DFS order.
          items: { $ref: "#/components/schemas/TaskId" }

    CreateProjectRequest:
      type: object
      description: Create a new empty project under the "Projects" root.
      required: [title]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1

    RenameProjectRequest:
      type: object
      description: Rename a project or area section.
      required: [title]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1

    ArchiveProjectResult:
      type: object
      description: Summary of a project archive sweep. The project resource no longer exists.
      required: [id, archived, moved_ids]
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/TaskId" }
        archived:
          type: integer
          minimum: 0
          description: Number of records (section + descendants) moved to the archive.
        moved_ids:
          type: array
          description: Stable ids moved to the archive, root section first.
          items: { $ref: "#/components/schemas/TaskId" }

    RecurrenceExplanation:
      description: |
        The result of parsing one schedule input. Exactly one of the three
        shapes applies, and they are told apart structurally rather than by a
        status field: a projection has `next` and no `error`, an anchor-bound
        failure has both, and an unparsable input has neither `canonical` nor
        `next`. `input` is echoed verbatim in all three so a batched caller can
        match answers to questions.
      oneOf:
        - title: Projected
          type: object
          required: [input, canonical, human, next]
          additionalProperties: false
          properties:
            input: { type: string }
            canonical:
              type: [string, "null"]
              description: |
                The value a write would store, or null for a clearing word
                (`off`, `none`, `never`).
            human: { type: string }
            next:
              type: array
              description: |
                The next occurrences, ascending, starting strictly after today.
                At most `count` entries; empty when `count` is 0 or the input
                was a clearing word.
              items: { $ref: "#/components/schemas/IsoDateOnly" }
        - title: NeverFires
          type: object
          description: |
            Understood, but unreachable from today's anchor — the schedule and
            the anchor together decide this, so the input is still reported in
            canonical form.
          required: [input, canonical, human, next, error]
          additionalProperties: false
          properties:
            input: { type: string }
            canonical: { type: string }
            human: { type: string }
            next:
              type: array
              maxItems: 0
              items: { $ref: "#/components/schemas/IsoDateOnly" }
            error:
              type: string
              description: Why no occurrence could be found.
        - title: Unparsable
          type: object
          description: Not a schedule; `error` is the parser's own reason.
          required: [input, error]
          additionalProperties: false
          properties:
            input: { type: string }
            error: { type: string }

    Task:
      type: object
      description: |
        The canonical persistence-neutral task resource. It intentionally omits
        physical JSONL coordinates (no `line`) and pre-rendered presentation
        (no headline). Writable own fields (`scheduled`, `deadline`,
        `deferred`) are distinct from the derived effective availability fields.
      required:
        - id
        - revision
        - source
        - parent_id
        - section_id
        - depth
        - state
        - priority
        - title
        - contexts
        - tags
        - deferred
        - scheduled
        - scheduled_time
        - deadline
        - deadline_time
        - available
        - availability_reason
        - availability_blocker_id
        - available_at
        - recurrence
        - recurrence_human
        - lead
        - lead_human
        - lead_opens
        - lead_opens_at
        - body
        - closed
        - rejected
        - archived
        - project
        - child_count
        - descendant_count
        - formal_links
        - links
        - delegation
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/TaskId" }
        revision:
          type: string
          description: |
            Opaque optimistic-concurrency token, mirrored as the HTTP ETag.
            Compare for equality only; the internal structure is not part of
            this contract (see ADR-0007).
        source:
          type: string
          enum: [live, archive]
        parent_id:
          description: Parent task id, or null when the task sits directly under a section.
          oneOf:
            - { $ref: "#/components/schemas/TaskId" }
            - { type: "null" }
        section_id:
          description: Enclosing section id.
          oneOf:
            - { $ref: "#/components/schemas/TaskId" }
            - { type: "null" }
        depth:
          type: integer
          minimum: 0
          description: Nesting depth below its section (0 for a top-level task).
        state: { $ref: "#/components/schemas/State" }
        priority: { $ref: "#/components/schemas/Priority" }
        title:
          type: string
        contexts:
          type: array
          description: The task's `@context` tags. A distinct semantic field.
          items: { type: string }
        tags:
          type: array
          description: Ordinary tags only (no `@context`, no the `defer` marker).
          items: { type: string }
        deferred:
          type: boolean
          description: |
            Whether this task itself carries the indefinite On Hold
            (Someday/Maybe) marker. This own writable field is not an ordinary
            tag and is not a synonym for `available == false`.
        scheduled:
          allOf:
            - { $ref: "#/components/schemas/IsoDate" }
          description: Own available-from/start/defer-until date, or null.
        scheduled_time:
          $ref: "#/components/schemas/TaskTime"
        deadline:
          allOf:
            - { $ref: "#/components/schemas/IsoDate" }
          description: Independent due date, or null.
        deadline_time:
          $ref: "#/components/schemas/TaskTime"
        available:
          type: boolean
          readOnly: true
          description: Effective, ancestor-aware availability as of this response.
        availability_reason:
          type: string
          readOnly: true
          enum: [available, scheduled, on_hold, ancestor_scheduled, ancestor_on_hold, proposed, closed]
          description: Why the task is or is not effectively available.
        availability_blocker_id:
          readOnly: true
          description: Stable id of the task that owns the blocker, or null when available/closed.
          oneOf:
            - { $ref: "#/components/schemas/TaskId" }
            - { type: "null" }
        available_at:
          type: [string, "null"]
          format: date-time
          readOnly: true
        recurrence:
          type: [string, "null"]
          description: |
            The stored schedule in its canonical spelling, or null. Two shapes
            share the field: an interval cookie (`.+1w`, `+2d`, `++1m`) that
            advances the stamp by a fixed span, and a calendar schedule
            (`w:mon,wed`, `2w:mon`, `m:15`, `m:last`, `m:2tue`, `y:07-04`) that
            advances to the next matching calendar date. Writes accept friendly
            phrasings too (see `CreateTaskRequest.recurrence`); what comes back
            is always canonical, so two inputs meaning the same schedule read
            back identically.
        recurrence_human:
          type: [string, "null"]
          readOnly: true
          description: |
            One-line rendering of `recurrence` for display ("every Mon, Wed,
            Fri", "monthly on the 2nd Tuesday", "every 2 weeks from
            completion"), or null when the task does not recur. A pure string
            render of the stored value — it projects no dates, so it is present
            on collection rows as well as single resources. For the next
            occurrences of a schedule, call `GET /recurrence/explain`. A stored
            value that no longer parses is echoed verbatim rather than hidden.
        lead:
          type: [string, "null"]
          description: |
            The lead-time window in its canonical spelling — a positive count
            and a calendar unit (`3w`, `2d`, `1m`, `10y`) — or null. The task
            is hidden until that span before its ANCHOR: its `deadline` if it
            has one, otherwise its `scheduled` date. Writes accept friendly
            phrasings too (see `CreateTaskRequest.lead`).
        lead_human:
          type: [string, "null"]
          readOnly: true
          description: |
            One-line rendering of `lead` for display ("3 weeks", "1 day"), or
            null when the task carries no lead. A pure string render, so it is
            present on collection rows as well as single resources.
        lead_opens:
          type: [string, "null"]
          format: date
          readOnly: true
          description: |
            The date this task's own lead window opens (`anchor - lead`), or
            null. Derived from the task's own anchor, so it keeps answering
            "when does my window open" even while an ancestor's gate or an
            indefinite hold is what currently hides the task. For the effective
            answer — including ancestors — read `available`/`available_at`.
        lead_opens_at:
          type: [string, "null"]
          format: date-time
          readOnly: true
          description: |
            The exact instant this task's own lead window opens, or null. For a
            calendar span this is local midnight of `lead_opens`; for a CLOCK
            span (`5h`) it is the only precise answer, since the window opens
            partway through a day. Derived from the task's own anchor, like
            `lead_opens`.
        body:
          type: array
          description: The task's own notes, split to lines. A child's body never leaks in.
          items: { type: string }
        closed: { $ref: "#/components/schemas/IsoDate" }
        rejected:
          allOf:
            - $ref: "#/components/schemas/IsoDate"
          description: |
            The declined-proposal marker: the day a PROPOSED task was rejected.
            Present only on a CANCELLED task that was declined at review, so a
            client can tell a decline from an ordinary cancellation. Null
            everywhere else. `POST /tasks/{id}/unreject` restores exactly the
            tasks that carry it.
        archived:
          type: boolean
          description: True when this resource comes from the read-only archive.
        project:
          type: [string, "null"]
          description: Nearest open project (a live parent task, else the enclosing section).
        child_count:
          type: integer
          minimum: 0
          description: Number of direct children.
        descendant_count:
          type: integer
          minimum: 0
          description: Number of tasks in the subtree below this one.
        formal_links:
          type: array
          description: Ordered stored links owned by the task and writable through PATCH.
          items: { $ref: "#/components/schemas/FormalLink" }
        links:
          type: array
          readOnly: true
          description: Openable union of formal, title, and body links, deduplicated by URL.
          items: { $ref: "#/components/schemas/Link" }
        delegation:
          description: |
            Who currently holds this task, or `null` when it is not delegated —
            there is no empty delegation. Written only through the delegation
            actions (`/delegate`, `/undelegate`, `/claim`, `/release`,
            `/work_ref`), never through `PATCH /tasks/{id}`. Retained verbatim
            as provenance when a claimed or human-delegated task closes and is
            archived; an unclaimed agent marker is cleared on close. Completing
            a *recurring* delegated task rolls the standing intent forward
            instead of closing: the next occurrence keeps the agent `mode` or
            the person, always unclaimed, with a fresh `at` and no `work_ref` —
            the claim and the reference belonged to the cycle that just
            finished. Only `/undelegate` stops a standing delegation.

            Read `delegation` on closed and archived tasks with
            `GET /tasks?scope=done|archived|all&delegated=true`.
          oneOf:
            - { $ref: "#/components/schemas/Delegation" }
            - { type: "null" }

    DelegationKind:
      type: string
      enum: [human, agent]

    DelegationMode:
      type: string
      enum: [refine, research, implement]
      description: |
        Agent authority. `refine` may improve the task itself; `research` adds
        read-only investigation and a written brief; `implement` adds changing
        files within the task's named scope and completing it when its criteria
        are met. Modes never authorize scope expansion, deployment, messaging,
        purchases, or destructive external actions.

    DelegationStatus:
      type: string
      enum: [delegated, ready, claimed]
      description: |
        `delegated` for a human hand-off, `ready` for unclaimed agent work, and
        `claimed` while exactly one worker holds it.

    Delegation:
      type: object
      description: |
        The task's delegation marker. Keys are emitted in the fixed order
        `kind, mode, status, assignee, at, work_ref`, and keys that do not apply
        are omitted entirely rather than sent as null — the same bytes the store
        writes and `tasks show --json` prints. `mode` applies to agent
        delegations only; `assignee` is the email address for a human hand-off
        and the worker id of the holder while `claimed`, and is absent while
        `ready`.

        Nested keys this server does not know are round-tripped verbatim rather
        than dropped — a claim or release written by an older binary must not
        silently delete a newer one's field — and reported by `tasks check` as a
        warning, not an error. A response may therefore carry properties beyond
        those listed here, which is why this schema is open.
      required: [kind, status, at]
      properties:
        kind: { $ref: "#/components/schemas/DelegationKind" }
        mode: { $ref: "#/components/schemas/DelegationMode" }
        status: { $ref: "#/components/schemas/DelegationStatus" }
        assignee:
          type: string
          maxLength: 200
          description: |
            Email address (human) or worker id (claimed agent work). An
            identifier, not a mail or messaging integration. A human assignee is
            address-shaped — a non-empty local part, exactly one `@`, and a
            dotted domain — so `@work` and `pat@localhost` are refused. Worker
            ids are free-form tokens; the recommended form is
            `<harness>/<model>/<session-id>`. Both reject Unicode whitespace
            (not just ASCII) and control/escape characters, because four
            surfaces render these strings raw.
        at:
          type: string
          description: UTC timestamp of the last status transition (`YYYY-MM-DDTHH:MM:SSZ`).
        work_ref:
          type: string
          maxLength: 500
          description: |
            One single-line reference to where the work lives (ticket, PR,
            brief, or agent session): at most 500 characters, no line breaks,
            no control characters. Absent when unset. Other task references belong
            in `formal_links` or the task body.

    DelegateTaskRequest:
      type: object
      description: |
        Hand the task to a person or to the agent pool, replacing any marker
        already present. A human delegation carries `assignee` and no `mode`; an
        agent delegation carries `mode` and no `assignee` — an agent task is
        claimed by a worker, never assigned to one.
      required: [kind]
      additionalProperties: false
      properties:
        kind: { $ref: "#/components/schemas/DelegationKind" }
        mode:
          allOf:
            - { $ref: "#/components/schemas/DelegationMode" }
          description: |
            Required for `kind: agent`, rejected for `kind: human`.
        assignee:
          type: string
          maxLength: 200
          description: |
            Required for `kind: human`: an address-shaped identifier — a
            non-empty local part, exactly one `@`, and a dotted domain, with no
            whitespace or control characters. `@work` and `pat@localhost` are
            `422`. Rejected for `kind: agent`.
        keep_state:
          type: boolean
          default: false
          description: |
            Human delegation moves the task to `WAITING` — the next action is
            outside the owner's control, which is what `WAITING` means. Set true
            to leave the lifecycle state alone. Agent delegation never changes
            state, and this field is inert there.

    ClaimTaskRequest:
      type: object
      description: |
        Atomic pickup of agent-ready work. Exactly one worker can hold a task;
        a lost race is `409` / `claim_conflict` naming the holder.
      required: [worker]
      additionalProperties: false
      properties:
        worker:
          type: string
          maxLength: 200
          description: |
            The claiming worker id: non-empty, at most 200 characters, and free
            of Unicode whitespace and control/escape characters. Recommended
            form `<harness>/<model>/<session-id>`. It needs to be stable only
            for the lifetime of the claim; there is no lease to renew.

    ReleaseTaskRequest:
      type: object
      description: |
        Hand a claim back to the agent-ready queue. A worker supplies the id
        matching the live claim; the owner passes `force: true` instead to clear
        a stale claim without undelegating. Supplying neither is `422`.
      additionalProperties: false
      properties:
        worker:
          type: string
          maxLength: 200
          description: The worker id that must match the live claim.
        force:
          type: boolean
          default: false
          description: Owner override — release whoever holds it.
        note:
          type: [string, "null"]
          description: |
            A blocker note appended to the task body in the same undo step as
            the release. This is how a blocked agent surfaces a problem instead
            of widening its authority.

    RejectTaskRequest:
      type: object
      description: |
        Optional withdrawal rationale for `POST /tasks/{id}/reject`. An omitted
        or empty body rejects without notes. `notes` mirrors repeatable CLI
        `reject --note` and is appended to the task body in the same write.
      additionalProperties: false
      properties:
        notes:
          oneOf:
            - type: string
            - type: array
              items: { type: string }
          description: |
            Withdrawal rationale. A string may contain newlines; an array is
            joined with newlines in order (same as CLI repeatable `--note`).

    WorkRefRequest:
      type: object
      description: |
        Replace the task's single work reference. `null` clears it, as do the
        literal strings `off` and `none` (either word, case-insensitive) — the
        two spellings every surface accepts, normalized once in the domain so
        the CLI cannot store the word while the TUI clears.
      required: [work_ref]
      additionalProperties: false
      properties:
        work_ref:
          type: [string, "null"]
          maxLength: 500
          description: |
            A single-line URL or identifier of at most 500 characters with no
            control characters; `null`, `off`, or `none` to clear.
        worker:
          type: string
          maxLength: 200
          description: |
            Present when a worker writes the reference: the claim must still be
            held by exactly this id, otherwise `409` / `claim_conflict`. Absent
            means the owner is writing, which is always permitted on a delegated
            task.

    CreateTaskRequest:
      type: object
      description: |
        Full create attribute set, mirroring `application.CreateCommand`. `parent_id`
        and `project` are mutually exclusive placement inputs.
      required: [title]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
        priority: { $ref: "#/components/schemas/Priority" }
        tags:
          type: array
          description: |
            Ordinary tags; entries must not start with `@` (contexts have
            their own field) — an `@`-prefixed entry is rejected with 422.
          items: { type: string }
        contexts:
          type: array
          description: |
            `@contexts`; each entry must start with `@`. The adapter merges
            contexts and tags into the stored tag list (`application.CreateCommand`
            takes one array); the split fields keep the request unambiguous.
          items: { type: string }
        apply_host_context:
          type: boolean
          default: true
          description: |
            When true or omitted, add the context configured for the API
            server's host. The host context is additive with `contexts`.
            Set false to suppress it for this create only.
        deferred:
          type: boolean
          description: Create with an own indefinite On Hold marker. Default false.
          default: false
        scheduled:
          allOf:
            - { $ref: "#/components/schemas/IsoDate" }
          description: Available-from/start date; a future value makes the task unavailable.
        scheduled_time: { $ref: "#/components/schemas/TaskTimeInput" }
        deadline:
          allOf:
            - { $ref: "#/components/schemas/IsoDate" }
          description: Independent due date.
        deadline_time: { $ref: "#/components/schemas/TaskTimeInput" }
        state: { $ref: "#/components/schemas/State" }
        project:
          type: [string, "null"]
          description: Section heading to file under (default Inbox). Mutually exclusive with parent_id.
        parent_id:
          description: Nest as the last child of this task. Mutually exclusive with project.
          oneOf:
            - { $ref: "#/components/schemas/TaskId" }
            - { type: "null" }
        recurrence:
          type: [string, "null"]
          description: |
            The schedule this task repeats on. Implies a date: with neither
            `scheduled` nor `deadline` supplied, today becomes the first
            occurrence. Two input syntaxes are accepted and both normalize to
            one canonical stored value (echoed back as `recurrence`):

            - **Interval** — a cookie (`.+1w` from completion, `+2d` from the
              stored date, `++1m` catching up) or a phrase (`weekly`,
              `every 3 days`, `2w`). A bare interval means "from completion".
            - **Calendar** — a phrase (`every monday`, `every mon wed fri`,
              `weekdays`, `the 15th of the month`, `last day of the month`,
              `2nd tuesday`, `every 2 weeks on monday`, `every july 4`) or the
              canonical grammar (`w:mon,wed`, `2w:mon`, `m:15`, `m:last`,
              `m:2tue`, `y:07-04`). Bare calendar input means "the next
              matching date after today"; a leading `+` advances one occurrence
              at a time from the stored date instead.

            Unrecognized input is `422` and the error names the reason the
            parser gave. A schedule that parses but could never fire from this
            task's date is refused the same way. Call
            `GET /recurrence/explain` first to check a schedule without writing.
            `off`/`none`/`never` clears a schedule and is only meaningful on
            PATCH.
        lead:
          type: [string, "null"]
          description: |
            Hide this task until a span before its ANCHOR — its `deadline` if
            supplied, otherwise its `scheduled` date. A count and a calendar
            unit, canonical (`3w`, `2d`, `1m`, `10y`) or phrased (`3 weeks`,
            `a week`, `10 days`); both store one canonical value, echoed back
            as `lead`. `h` is the one clock unit (`5h` opens the window five
            hours before the anchor's instant — an all-day anchor resolves to
            the first instant of its date, so `5h` before June 1 is 19:00 on
            May 31 local). `m` always means months, never minutes.

            Rules, each refused with `422` and a message naming the fix: the
            task needs one of the two dates to hide before; a lead may not sit
            beside a SEPARATE available-from date (supplying both `deadline`
            and `scheduled` with a lead is refused, since the second gate would
            be silently ignored); and the derived date must stay in the storable
            year range. There is no state rule — a lead rides with the date
            fields, so a proposal takes one on the same terms it takes
            `deadline`.
            `off`/`none`/`never` clears a lead and is only meaningful on PATCH.
        body:
          description: |
            Initial notes. Either one string (newlines allowed) or an ordered
            array of note lines; supplying both spellings is rejected.
          oneOf:
            - { type: string }
            - { type: array, items: { type: string } }
            - { type: "null" }

    TaskPlacement:
      type: object
      description: |
        Stable anchor-relative placement for a whole task subtree. `parent_id`
        identifies the destination live task or section. `before_id`, when
        present and non-null, identifies a live direct-child task of that
        parent; omitting it or sending null appends as the last child.
      required: [parent_id]
      additionalProperties: false
      properties:
        parent_id:
          $ref: "#/components/schemas/TaskId"
        before_id:
          oneOf:
            - { $ref: "#/components/schemas/TaskId" }
            - { type: "null" }

    PatchTaskRequest:
      type: object
      description: |
        Merge-semantics partial update, mirroring the application changeset
        editable field set. An absent field is unchanged; an explicit `null`
        clears a clearable field; unknown fields are rejected. `parent_id` is
        the location input (moving places the subtree as the last child of the
        new parent). `placement` supplies an exact parent/anchor location and
        cannot be combined with `parent_id`. Fields apply in
        `TaskChangeset::FIELD_ORDER`. A date without its companion time field
        preserves existing time metadata. A time object replaces the whole
        companion; time null makes the date all-day; date null clears both.
        Non-null time with a null date is rejected.
      additionalProperties: false
      minProperties: 1
      allOf:
        - not:
            required: [parent_id, placement]
      properties:
        title:
          type: string
          minLength: 1
        priority: { $ref: "#/components/schemas/Priority" }
        body:
          oneOf:
            - { type: string }
            - { type: array, items: { type: string } }
        formal_links:
          type: array
          description: Full replacement of the task's ordered stored formal-link list.
          maxItems: 50
          items: { $ref: "#/components/schemas/FormalLink" }
        contexts:
          type: array
          items: { type: string }
        tags:
          type: array
          items: { type: string }
        deferred:
          type: boolean
          description: Set or clear the task's own indefinite On Hold marker.
        scheduled:
          allOf:
            - { $ref: "#/components/schemas/IsoDate" }
          description: Set/clear the available-from date without moving deadline.
        scheduled_time: { $ref: "#/components/schemas/TaskTimeInput" }
        deadline:
          allOf:
            - { $ref: "#/components/schemas/IsoDate" }
          description: Set/clear the independent due date.
        deadline_time: { $ref: "#/components/schemas/TaskTimeInput" }
        recurrence:
          type: [string, "null"]
          description: |
            Set the repeat schedule, accepting the same two input syntaxes as
            `CreateTaskRequest.recurrence` and storing the same canonical value.
            `null` — or the words `off`, `none`, `never` — removes it.
        lead:
          type: [string, "null"]
          description: |
            Set the lead-time window, accepting the same input as
            `CreateTaskRequest.lead` and storing the same canonical span.
            `null` — or the words `off`, `none`, `never` — removes it.
            Clearing is always allowed, including on a task whose current
            shape a fresh lead would be refused on.
        parent_id:
          description: New location. Null unnests the subtree to the section level.
          oneOf:
            - { $ref: "#/components/schemas/TaskId" }
            - { type: "null" }
        placement:
          $ref: "#/components/schemas/TaskPlacement"
        state: { $ref: "#/components/schemas/State" }

    HistoryStepRequest:
      type: object
      required: [store_revision]
      additionalProperties: false
      properties:
        store_revision:
          type: string
          description: The store revision the client last saw. A mismatch returns 409.

    HistoryStepResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [label, store_revision]
          properties:
            label:
              type: [string, "null"]
              description: The label of the step that was applied.
            store_revision:
              type: string
              description: The new global store revision after the step.
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    ErrorEnvelope:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, request_id]
          additionalProperties: false
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message:
              type: string
              description: A safe, human-readable summary. Never contains paths or backtraces.
            details:
              type: object
              description: Structured, code-specific context (per-field errors, counts, current resource).
              additionalProperties: true
            request_id:
              type: string
              description: Correlates the response with a server log line.

    ErrorCode:
      type: string
      description: |
        Stable machine error code. The set is derived from `MutationResult`
        statuses (not_found, stale→stale_revision, invalid→validation_failed,
        conflict, cycle, too_deep, unsupported_schema→unsupported_schema_version,
        store_invalid, unavailable), the delegation-specific
        `claim_conflict` refinement of `conflict`, plus transport
        errors (malformed_request, unsupported_media_type, payload_too_large,
        missing_precondition, forbidden_origin). `ok`/`no_change` are successes,
        not errors, and are not listed here.
      enum:
        - malformed_request
        - forbidden_origin
        - not_found
        - conflict
        - claim_conflict
        - cycle
        - too_deep
        - stale_revision
        - payload_too_large
        - unsupported_media_type
        - validation_failed
        - missing_precondition
        - unsupported_schema_version
        - store_invalid
        - unavailable
