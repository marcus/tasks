openapi: 3.1.0
info:
  title: Tasks local HTTP API
  version: 1.0.0
  summary: Loopback REST/JSON contract over the same tasks.jsonl the CLI and TUI use.
  description: |
    The v1 contract for the local-first Tasks HTTP API. It is another adapter
    around `internal/application`, not a second task implementation: every write
    passes the same file lock, atomic writer, structural `internal/check`,
    rollback, and shared undo journal as the CLI and TUI.

    Design rationale lives in ADR-0005 through ADR-0009. Manual anchor-relative
    placement is specified by ADR-0009.

    Conventions that hold for every operation:

    - Stable eight-hex task ids are the only public task locator. Fuzzy titles
      and `L<line>` refs are CLI-only conveniences and are never accepted here.
    - Requests and responses are `application/json` only. A body with any other
      content type on a mutation is `415`.
    - JSON request bodies are limited to 65536 bytes (64 KiB). Larger bodies
      are rejected with `413` / `payload_too_large` before JSON parsing.
      DELETE has no request body; a non-empty body is rejected.
    - Unknown request fields are rejected (`422` / `validation_failed`), never
      silently ignored.
    - Successful responses use the envelope `{ "data": ..., "meta": { ... } }`.
      `meta` reports the store revision the answer was read at, so the few
      operations that read no store omit it: the health probes carry no
      envelope at all, and `GET /recurrence/explain` carries `data` only.
      Errors use `{ "error": { "code", "message", "details", "request_id" } }`.
    - `revision` is an opaque string. Operation descriptions name semantic
      precondition scopes, but component positions and digest recipes are not
      part of this contract; see ADR-0007. Clients compare it for equality only.
      Clients refetch task resources after reconnecting to a restarted API;
      `store_revision` tracks backing-store bytes, not server-side ETag recipe
      changes, so a pre-upgrade `If-Match` may receive a conservative `412`.
    - Dates are ISO `YYYY-MM-DD` strings or `null`. Friendly date parsing is a
      human CLI/TUI feature and is not part of this contract.
      Optional companion time objects preserve minute-precision civil time,
      floating/fixed mode, IANA zone, and fold choice. A time does not create a reminder.
    - `scheduled` is the available-from/start/defer-until value; `deadline` is
      the separate due value. `deferred` means the task's own indefinite On Hold
      marker. Derived effective availability is ancestor-aware.
    - The server never returns filesystem paths, journal locations, or
      exception backtraces.

servers:
  - url: http://127.0.0.1:{port}/api/v1
    description: Loopback API base. Bound to 127.0.0.1 in local mode.
    variables:
      port:
        default: "4747"
        description: Configured local port.

tags:
  - name: meta
    description: Server capabilities and change token.
  - name: sections
    description: Ordered live sections for placement controls.
  - name: tasks
    description: Task resource CRUD.
  - name: projects
    description: Projects and areas rolled up over their open tasks.
  - name: recurrence
    description: Taskless schedule parsing and projection.
  - name: views
    description: Canonical named selections (agenda, next, quadrants, inbox, projects).
  - name: history
    description: Shared undo/redo journal.
  - name: archive
    description: Archive sweep preview and application.
  - name: events
    description: Store-change invalidation stream.
  - name: health
    description: Liveness and readiness probes (outside /api/v1).

paths:
  /meta:
    get:
      tags: [meta]
      operationId: getMeta
      summary: Server capabilities, vocabularies, config-derived limits, and store revision.
      description: |
        Returns the enumerable vocabularies (states, priorities), config-derived
        limits (`max_depth`, `urgent_days`), server mode, and the global
        `store_revision`. Never returns filesystem paths. Conditional polling of
        this endpoint is the v1 default for change detection; see `/events`.
      responses:
        "200":
          description: Capabilities and current store revision.
          headers:
            ETag:
              description: Current global store revision, also present in `meta.store_revision`.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Meta" }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
              examples:
                default:
                  value:
                    data:
                      api_version: "v1"
                      server_mode: "loopback"
                      states: [PROPOSED, INBOX, TODO, NEXT, WAITING, DONE, CANCELLED]
                      proposed_states: [PROPOSED]
                      open_states: [INBOX, TODO, NEXT, WAITING]
                      closed_states: [DONE, CANCELLED]
                      priorities: [A, B, C]
                      delegation_kinds: [human, agent]
                      delegation_modes: [refine, research, implement]
                      delegation_statuses: [delegated, ready, claimed]
                      max_depth: 4
                      urgent_days: 3
                      timezone: "America/Los_Angeles"
                      time_format: 12
                      tzdb_version: "zoneinfo"
                      temporal_precision: "minute"
                      capabilities:
                        projects: true
                        undo: false
                        redo: false
                        archive_sweep: false
                        events: false
                    meta:
                      store_revision: "s1.6f2a9c0b"
        "503":
          $ref: "#/components/responses/StoreInvalid"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /sections:
    get:
      tags: [sections]
      operationId: listSections
      summary: Ordered live sections for capture and placement.
      description: |
        Live section records in display order. Sections carry the same checked
        eight-hex ids as tasks. Archive sections are not returned.
      responses:
        "200":
          description: Ordered sections.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Section" }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
              examples:
                default:
                  value:
                    data:
                      - id: "1a2b3c4d"
                        title: "Inbox"
                        parent_id: null
                      - id: "9f8e7d6c"
                        title: "Work"
                        parent_id: null
                    meta:
                      store_revision: "s1.6f2a9c0b"
        "503":
          $ref: "#/components/responses/StoreInvalid"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /tasks:
    get:
      tags: [tasks]
      operationId: listTasks
      summary: Ordered task collection with composable filters.
      description: |
        Returns tasks in DFS display order. Filters compose and mirror
        `internal/query.Filter` / `tasks list`. The default scope is open live
        tasks; effectively unavailable tasks are hidden from the default scope.
        Collection order conveys display order only — `line` is never exposed
        and is not a stable sort key.
      parameters:
        - name: scope
          in: query
          description: |
            Which slice to list. Default `open` (open live tasks).

            `open`, `proposed`, `done`, `archived`, `all`, and `rejected` are
            lifecycle/source slices. `rejected` is the declined-proposal review
            slice: CANCELLED tasks carrying the `rejected` marker, live plus
            recently archived, declined within the last 30 days, newest decline
            first — the HTTP mirror of `tasks list --rejected`.
             `delegated` and `agent_ready` are delegation refinements of
            the default open-live slice, mirroring `tasks list --delegated`
            (under its default `--open`) and `tasks list --agent-ready`:

            - `delegated` — the documented shorthand for
              `scope=open&delegated=true`: every open live *and effectively
              available* task carrying a `delegation`, human or agent, ready or
              claimed. To read delegation provenance on closed or archived work,
              use the `delegated` query parameter with the lifecycle scope you
              mean (`scope=done&delegated=true`, `scope=all&delegated=true`).
            - `agent_ready` — the claimable queue: `kind: agent`,
              `status: ready`, an accepted live state, and effectively available
              now. Ranked by priority, then the soonest deadline-or-scheduled
              boundary, then canonical order — the order is a contract, because a
              heartbeat agent takes the first row it is capable of. A list read
              never grants ownership; only `POST /tasks/{id}/claim` does. This
              scope is open-only by construction — a closed task is not
              claimable — and combining it with `delegated` or with a closed
              `state` is `422`, never a silently empty collection.

            Other filters compose with both. `available=false` remains valid only
            with `scope=open`.
          required: false
          schema:
            type: string
            enum: [open, proposed, done, archived, all, rejected, delegated, agent_ready]
            default: open
        - name: delegated
          in: query
          description: |
            When true, list only tasks carrying a `delegation` marker — human or
            agent, ready or claimed — exactly as `tasks list --delegated` does.
            Unlike `scope=delegated`, this composes with EVERY lifecycle scope,
            because a claimed or human delegation is retained verbatim as
            provenance when the task closes and is swept:
            `scope=done&delegated=true` and `scope=all&delegated=true` answer
            "which closed tasks were delegated, to whom, and where did the work
            land" (`delegation.assignee` and `delegation.work_ref` on each row).
            `scope=archived&delegated=true` reads the same from the archive.

            `false` and omitted are equivalent (no delegation filter).
            `scope=delegated` implies `delegated=true`, so pairing it with
            `delegated=false` is `422`; pairing this parameter with
            `scope=agent_ready` is `422` because that scope is already a
            delegation slice.
          required: false
          schema: { type: boolean }
        - name: state
          in: query
          description: |
            Restrict to one lifecycle state. Intersects with `scope`: the
            result contains only tasks whose state is in the scope's state set
            AND equals this value, so `scope=open&state=DONE` is an empty
            collection, not an error. The two delegation scopes are the one
            exception: `scope=delegated|agent_ready` with a non-open `state` is
            `422` naming the query that would answer it, because an empty
            collection there is indistinguishable from "nothing is delegated".
          required: false
          schema: { $ref: "#/components/schemas/State" }
        - name: context
          in: query
          description: Filter by an `@context` (with or without the leading `@`).
          required: false
          schema: { type: string }
        - name: tag
          in: query
          description: Filter by an ordinary tag (no leading `@`).
          required: false
          schema: { type: string }
        - name: priority
          in: query
          description: Filter by priority.
          required: false
          schema: { $ref: "#/components/schemas/Priority" }
        - name: text
          in: query
          description: Case-insensitive substring over titles (and bodies when `body=true`).
          required: false
          schema: { type: string }
        - name: body
          in: query
          description: Widen `text` matching into task notes/body. Default false (title-only).
          required: false
          schema: { type: boolean, default: false }
        - name: deferred
          in: query
          description: |
            When true, filter by the task's own indefinite On Hold marker under
            any scope. This is not a synonym for effective unavailability and
            does not include timed or inherited blockers. When false or omitted,
            the scope's default applies. `false` and omitted are equivalent.
          required: false
          schema: { type: boolean, default: false }
        - name: available
          in: query
          description: |
            Filter by effective, ancestor-aware availability. `available=false`
            is the timed/inherited/indefinite review for open live tasks and is
            rejected with `scope=proposed|done|archived|all|rejected`; closed resources report
            `available: false` only when fetched directly. Omitted means the
            selected scope's default behavior.
          required: false
          schema: { type: boolean }
        - name: recurring
          in: query
          description: |
            When true, list only tasks that carry a recurrence — an interval
            cookie or a calendar schedule alike. Unchanged by the calendar
            shapes: it asks whether the task repeats, not how.
          required: false
          schema: { type: boolean }
      responses:
        "200":
          description: Matching tasks in DFS order.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Task" }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
              examples:
                default:
                  value:
                    data:
                      - id: "3c4d5e6f"
                        revision: "v1.opaque-own.opaque-location.opaque-lifecycle"
                        source: "live"
                        parent_id: null
                        section_id: "9f8e7d6c"
                        depth: 0
                        state: "NEXT"
                        priority: "A"
                        title: "Email the vendor about the renewal"
                        contexts: ["@desk"]
                        tags: ["billing"]
                        deferred: false
                        scheduled: null
                        scheduled_time: null
                        deadline: null
                        deadline_time: null
                        available: true
                        availability_reason: "available"
                        availability_blocker_id: null
                        available_at: null
                        recurrence: null
                        recurrence_human: null
                        lead: null
                        lead_human: null
                        lead_opens: null
                        lead_opens_at: null
                        body: ["Captured 2026-07-14.", "Confirm the seat count first."]
                        closed: null
                        rejected: null
                        archived: false
                        project: "Work"
                        child_count: 0
                        descendant_count: 0
                        delegation: null
                        formal_links: []
                        links:
                          - system: "github"
                            url: "https://github.com/acme/app/issues/12"
                            label: "acme/app#12"
                            source: "body"
                    meta:
                      store_revision: "s1.6f2a9c0b"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/StoreInvalid"
    post:
      tags: [tasks]
      operationId: createTask
      summary: Atomically create one live task.
      description: |
        Creates one task in a single checked, journaled transaction (capture
        plus any recurrence and initial notes). Mirrors `application.CreateCommand`. A
        task created with a date lands processed as TODO unless `state`
        overrides it; a recurrence implies a date. On success returns `201`
        with a `Location` header, the created resource, and its `ETag`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTaskRequest" }
            examples:
              minimal:
                summary: Minimal capture (lands in INBOX).
                value:
                  title: "Email the vendor about the renewal"
              lead_time:
                summary: Hidden until three weeks before its deadline.
                value:
                  title: "Renew the passport"
                  deadline: "2026-11-01"
                  lead: "3w"
                  project: "Work"
              full:
                summary: Full attribute set.
                value:
                  title: "Weekly review"
                  priority: "A"
                  tags: ["review"]
                  contexts: ["@desk"]
                  deferred: false
                  scheduled: "2026-07-20"
                  scheduled_time: null
                  deadline: null
                  deadline_time: null
                  state: "NEXT"
                  project: "Work"
                  parent_id: null
                  recurrence: "weekly"
                  apply_host_context: true
                  body: "Captured 2026-07-14.\nClear the inbox to zero."
      responses:
        "201":
          description: Task created.
          headers:
            Location:
              description: Path of the created task resource.
              schema: { type: string }
            ETag:
              description: Opaque revision of the created task.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Task" }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
              examples:
                created:
                  value:
                    data:
                      id: "3c4d5e6f"
                      revision: "v1.opaque-own.opaque-location.opaque-lifecycle"
                      source: "live"
                      parent_id: null
                      section_id: "9f8e7d6c"
                      depth: 0
                      state: "NEXT"
                      priority: "A"
                      title: "Email the vendor about the renewal"
                      contexts: ["@desk"]
                      tags: ["billing"]
                      deferred: false
                      scheduled: "2026-07-20"
                      scheduled_time: null
                      deadline: null
                      deadline_time: null
                      available: false
                      availability_reason: "scheduled"
                      availability_blocker_id: "3c4d5e6f"
                      available_at: null
                      recurrence: null
                      recurrence_human: null
                      lead: null
                      lead_human: null
                      lead_opens: null
                      lead_opens_at: null
                      body: ["Captured 2026-07-14."]
                      closed: null
                      rejected: null
                      archived: false
                      project: "Work"
                      child_count: 0
                      descendant_count: 0
                      delegation: null
                      formal_links: []
                      links: []
                    meta:
                      store_revision: "s1.7a1b2c3d"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "404":
          description: "`parent_id` does not identify an existing live task."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              examples:
                missing_parent:
                  value:
                    error:
                      code: "not_found"
                      message: "parent_id does not identify a live task."
                      details: { parent_id: "deadbeef" }
                      request_id: "req_4c1a"
        "409":
          description: Structural refusal nesting the task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              examples:
                too_deep:
                  value:
                    error:
                      code: "too_deep"
                      message: "Nesting the task would exceed the maximum depth."
                      details: { max_depth: 4 }
                      request_id: "req_5f3a"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "403":
          $ref: "#/components/responses/ForbiddenOrigin"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/StoreInvalid"

  /tasks/{id}:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    get:
      tags: [tasks]
      operationId: getTask
      summary: One full task resource.
      description: |
        Returns one live task by default. Pass `source=archive` to read an
        archived resource; archived resources are read-only.
      parameters:
        - name: source
          in: query
          description: Read the live task (default) or an explicitly archived one.
          required: false
          schema:
            type: string
            enum: [live, archive]
            default: live
      responses:
        "200":
          description: The task resource.
          headers:
            ETag:
              description: Opaque revision of this task.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Task" }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
              examples:
                default:
                  value:
                    data:
                      id: "3c4d5e6f"
                      revision: "v1.opaque-own.opaque-location.opaque-lifecycle"
                      source: "live"
                      parent_id: null
                      section_id: "9f8e7d6c"
                      depth: 0
                      state: "NEXT"
                      priority: "A"
                      title: "Email the vendor about the renewal"
                      contexts: ["@desk"]
                      tags: ["billing"]
                      deferred: false
                      scheduled: "2026-07-20"
                      scheduled_time: null
                      deadline: null
                      deadline_time: null
                      available: false
                      availability_reason: "scheduled"
                      availability_blocker_id: "3c4d5e6f"
                      available_at: null
                      recurrence: null
                      recurrence_human: null
                      lead: null
                      lead_human: null
                      lead_opens: null
                      lead_opens_at: null
                      body: ["Captured 2026-07-14.", "Confirm the seat count first."]
                      closed: null
                      rejected: null
                      archived: false
                      project: "Work"
                      child_count: 0
                      descendant_count: 0
                      delegation: null
                      formal_links: []
                      links:
                        - system: "github"
                          url: "https://github.com/acme/app/issues/12"
                          label: "acme/app#12"
                          source: "body"
                    meta:
                      store_revision: "s1.6f2a9c0b"
        "404":
          $ref: "#/components/responses/NotFound"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/StoreInvalid"
    patch:
      tags: [tasks]
      operationId: updateTask
      summary: Atomically apply semantic partial changes.
      description: |
        Applies a `store.Changeset` in one checked transaction. Merge
        semantics: an absent field is unchanged, an explicit `null` clears a
        clearable field, and unknown fields are rejected. Fields are applied in
        the deterministic field order defined by the shared application layer
        (scalar content, then tags, then dates, then recurrence, then location,
        then lifecycle state); coupled cases are locked down by tests, and a
        combination that cannot be made clear and atomic is rejected rather than
        split.

        `If-Match` is required. A semantically no-op change is a success: it
        returns `200` with the unchanged resource and its current `ETag`, and
        it does not burn an undo step.

        Any live task may be patched, including a `PROPOSED` task. Presentation
        fields such as title, priority, body, tags, and contexts can therefore
        be corrected before the proposal is approved or rejected; patching
        those fields does not change its lifecycle state.

        `placement` moves the whole subtree before a stable direct-child anchor,
        or appends it when `before_id` is omitted/null. It is mutually exclusive
        with the legacy top-level `parent_id` location input. Placement compares
        the content-only `own` component of the subject task revision; the
        server's `own` digest excludes structural location. It then validates
        the live parent and anchor under the Store mutation lock. After id
        resolution, self/descendant cycle checks run before anchor
        direct-parentage, so a descendant anchor is `409 cycle`; an unrelated
        wrongly-parented anchor is `409 conflict`. Legacy `parent_id` keeps its
        existing `own` plus separate `location` comparison.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchTaskRequest" }
            examples:
              multi_field:
                summary: Retitle, raise priority, and reschedule at once.
                value:
                  title: "Email the vendor about the 2027 renewal"
                  priority: "A"
                  scheduled: "2026-07-21"
                  scheduled_time: null
              defer_until:
                summary: Set timed availability and clear an own indefinite hold.
                value:
                  scheduled: "2026-07-21"
                  scheduled_time: null
                  deferred: false
              put_on_hold:
                summary: Hold indefinitely without changing either date.
                value:
                  deferred: true
              clear_deadline:
                summary: Clear a clearable field with explicit null.
                value:
                  deadline: null
                  deadline_time: null
              move:
                summary: Move the subtree under a new parent.
                value:
                  parent_id: "9f8e7d6c"
              place_before:
                summary: Place the subtree before a stable sibling under an explicit parent.
                value:
                  placement:
                    parent_id: "9f8e7d6c"
                    before_id: "4d5e6f7a"
              place_at_end:
                summary: Append the subtree as the last child of an explicit parent.
                value:
                  placement:
                    parent_id: "9f8e7d6c"
                    before_id: null
              complete:
                summary: Lifecycle transition.
                value:
                  state: "DONE"
      responses:
        "200":
          description: |
            Updated resource, or — for a semantic no-op — the unchanged resource
            with its current ETag.
          headers:
            ETag:
              description: New opaque revision after the change (unchanged on a no-op).
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Task" }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
              examples:
                updated:
                  value:
                    data:
                      id: "3c4d5e6f"
                      revision: "v1.new-own.opaque-location.opaque-lifecycle"
                      source: "live"
                      parent_id: null
                      section_id: "9f8e7d6c"
                      depth: 0
                      state: "NEXT"
                      priority: "A"
                      title: "Email the vendor about the 2027 renewal"
                      contexts: ["@desk"]
                      tags: ["billing"]
                      deferred: false
                      scheduled: "2026-07-21"
                      scheduled_time: null
                      deadline: null
                      deadline_time: null
                      available: false
                      availability_reason: "scheduled"
                      availability_blocker_id: "3c4d5e6f"
                      available_at: null
                      recurrence: null
                      recurrence_human: null
                      lead: null
                      lead_human: null
                      lead_opens: null
                      lead_opens_at: null
                      body: ["Captured 2026-07-14.", "Confirm the seat count first."]
                      closed: null
                      rejected: null
                      archived: false
                      project: "Work"
                      child_count: 0
                      descendant_count: 0
                      delegation: null
                      formal_links: []
                      links: []
                    meta:
                      store_revision: "s1.8b2c3d4e"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "404":
          description: The moving task, placement parent, or placement anchor is absent from the live store.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              examples:
                missing_task:
                  value:
                    error:
                      code: "not_found"
                      message: "No live task with that id."
                      details: { field: "id", id: "deadbeef" }
                      request_id: "req_6a0a"
                missing_parent:
                  value:
                    error:
                      code: "not_found"
                      message: "placement.parent_id does not identify a live task or section."
                      details: { field: "placement.parent_id", parent_id: "deadbeef" }
                      request_id: "req_6a0b"
                missing_anchor:
                  value:
                    error:
                      code: "not_found"
                      message: "placement.before_id does not identify a live task."
                      details: { field: "placement.before_id", before_id: "deadbeef" }
                      request_id: "req_6a0c"
        "409":
          description: |
            Structural refusal applying a move or ordered placement. After id
            resolution, cycle detection precedes anchor-parent validation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              examples:
                anchor_parent_changed:
                  value:
                    error:
                      code: "conflict"
                      message: "The placement anchor is no longer a direct child of the requested parent."
                      details:
                        parent_id: "9f8e7d6c"
                        before_id: "4d5e6f7a"
                        current_parent_id: "7a8b9c0d"
                      request_id: "req_6a1b"
                descendant_anchor_cycle:
                  value:
                    error:
                      code: "cycle"
                      message: "The placement parent or anchor cannot be the moving task or its descendant."
                      details:
                        parent_id: "9f8e7d6c"
                        before_id: "5e6f7a8b"
                      request_id: "req_6a1a"
                cycle:
                  value:
                    error:
                      code: "cycle"
                      message: "A task cannot be moved under itself or a descendant."
                      details: { parent_id: "3c4d5e6f" }
                      request_id: "req_6a1c"
                too_deep:
                  value:
                    error:
                      code: "too_deep"
                      message: "The placement would exceed max_depth."
                      details: { max_depth: 4 }
                      request_id: "req_6a1d"
        "412":
          $ref: "#/components/responses/StaleRevision"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "403":
          $ref: "#/components/responses/ForbiddenOrigin"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          description: Malformed fields, unknown placement members, or mutually exclusive location inputs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              examples:
                conflicting_location_inputs:
                  value:
                    error:
                      code: "validation_failed"
                      message: "One or more fields are invalid."
                      details:
                        fields:
                          placement: ["cannot be combined with parent_id"]
                          parent_id: ["cannot be combined with placement"]
                      request_id: "req_6a2a"
                malformed_placement:
                  value:
                    error:
                      code: "validation_failed"
                      message: "One or more fields are invalid."
                      details:
                        fields:
                          placement: ["must contain only parent_id and before_id"]
                      request_id: "req_6a2b"
        "428":
          $ref: "#/components/responses/MissingPrecondition"
        "503":
          $ref: "#/components/responses/StoreInvalid"
    delete:
      tags: [tasks]
      operationId: deleteTask
      summary: Undoable hard delete of a live task subtree.
      description: |
        Hard-deletes one live task from `tasks.jsonl` as one journal entry. It
        is not an alias for `CANCELLED` and never edits archive history. A leaf
        deletes directly; a task with descendants is refused with `409` unless
        `cascade=true` removes the whole contiguous subtree. Deletion never
        hoists or reparents children. Archived tasks are read-only and are not
        deletable: an archived-only id is `404` because the live file is the
        namespace. `If-Match` is required and is checked against all three
        revision components so a changed descendant, sibling, or the task itself
        refuses a stale cascade.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - name: cascade
          in: query
          description: Required to delete a task that still has descendants.
          required: false
          schema: { type: boolean, default: false }
      responses:
        "204":
          description: Task (and, with cascade, its subtree) deleted.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The task has descendants without `cascade`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              examples:
                has_descendants:
                  value:
                    error:
                      code: "conflict"
                      message: "The task has descendants; retry with cascade=true to delete them."
                      details:
                        descendants: 3
                        open_descendants: 2
                      request_id: "req_7b2d"
        "412":
          $ref: "#/components/responses/StaleRevision"
        "422":
          description: |
            The `If-Match` value is not a well-formed revision, or the id
            addresses a section rather than a task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              examples:
                malformed_revision:
                  value:
                    error:
                      code: "validation_failed"
                      message: "If-Match is not a well-formed task revision."
                      details: {}
                      request_id: "req_9e3f"
        "428":
          $ref: "#/components/responses/MissingPrecondition"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "403":
          $ref: "#/components/responses/ForbiddenOrigin"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          $ref: "#/components/responses/StoreInvalid"

  /tasks/{id}/approve:
