      operationId: approveTaskProposal
      summary: Accept a proposed task into INBOX.
      description: |
        Atomically transitions a live PROPOSED task to INBOX. The request has
        no body and requires the proposal's current ETag in `If-Match`.
        Proposed descendants must be decided first.
      parameters:
        - $ref: "#/components/parameters/TaskId"
