        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectTaskRequest"
      responses:
        "200":
          description: Rejected task resource.
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Task" }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Proposed descendants remain.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "412": { $ref: "#/components/responses/StaleRevision" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "428": { $ref: "#/components/responses/MissingPrecondition" }
        "503": { $ref: "#/components/responses/StoreInvalid" }

  /tasks/{id}/unreject:
    post:
      tags: [tasks]
      operationId: unrejectTaskProposal
      summary: Restore a declined proposal to PROPOSED.
      description: |
        Atomically returns a live CANCELLED task carrying the `rejected` marker
        to PROPOSED, in place: same id, title, body — including the withdrawal
        note the reject appended — tags and links. Nothing is created, so a
        restore can never mint a second id for work that already has one. Clears
        `closed` and the `rejected` marker. Refuses (`422`) anything that is not
        a rejected proposal, including an ordinary cancellation, and inherits the
        PROPOSED rules: no recurrence, no delegation, no accepted descendants.
        Takes no request body. Requires the task's current ETag in `If-Match`.
        The HTTP mirror of `tasks unreject`.
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Restored task resource, now PROPOSED.
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Task" }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/StaleRevision" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "428": { $ref: "#/components/responses/MissingPrecondition" }
        "503": { $ref: "#/components/responses/StoreInvalid" }

  /tasks/{id}/delegate:
    post:
      tags: [tasks]
      operationId: delegateTask
      summary: Hand the task to a person or to the agent pool.
      description: |
        Installs (or replaces) the task's `delegation` marker in one checked,
        journaled, undoable transaction, and requires the task's current ETag in
        `If-Match`. Only accepted live tasks qualify: `PROPOSED`, closed, and
        archived tasks refuse with `422` naming the state.

        A human delegation moves the task to `WAITING` unless `keep_state` is
        true. An agent delegation never changes lifecycle state either, with one
        exception: replacing a *person* on a task that is `WAITING` because of
        that person returns it to `TODO`, in the same undo step, because
        agent-ready work is actionable again. `keep_state` opts out of both
        directions. Re-delegating at the same mode or to the same person is a
        no-op that still returns the current resource. A task with a live claim refuses with `409` /
        `claim_conflict` — the owner revokes explicitly with `/undelegate`
        rather than taking a task out from under a working agent. A work
        reference survives a replacement of the same kind and is dropped when
        the delegation changes kind.
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DelegateTaskRequest" }
            examples:
              human:
                summary: Hand to a person; the task moves to WAITING.
                value:
                  kind: "human"
                  assignee: "pat@example.com"
              human_keep_state:
                summary: Hand to a person without touching the lifecycle state.
                value:
                  kind: "human"
                  assignee: "pat@example.com"
                  keep_state: true
              agent:
                summary: Publish to the agent pool at research authority.
                value:
                  kind: "agent"
                  mode: "research"
      responses:
        "200":
          description: The delegated task resource.
          headers:
            ETag:
              description: The task's revision after the write.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Task" }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
              examples:
                agent:
                  summary: Agent-ready at research authority.
                  value:
                    data:
                      id: "3c4d5e6f"
                      revision: "v1.opaque-own.opaque-location.opaque-lifecycle"
                      source: "live"
                      parent_id: null
                      section_id: "9f8e7d6c"
                      depth: 0
                      state: "TODO"
                      priority: "A"
                      title: "Compare CRDT libraries"
                      contexts: ["@computer"]
                      tags: []
                      deferred: false
                      scheduled: null
                      scheduled_time: null
                      deadline: null
                      deadline_time: null
                      available: true
                      availability_reason: "available"
                      availability_blocker_id: null
                      available_at: null
                      recurrence: null
                      recurrence_human: null
                      lead: null
                      lead_human: null
                      lead_opens: null
                      lead_opens_at: null
                      body: []
                      closed: null
                      rejected: null
                      archived: false
                      project: "Work"
                      child_count: 0
                      descendant_count: 0
                      formal_links: []
                      links: []
                      delegation:
                        kind: "agent"
                        mode: "research"
                        status: "ready"
                        at: "2026-07-27T18:02:00Z"
                    meta:
                      store_revision: "s1.6f2a9c0b"
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ClaimConflict" }
        "412": { $ref: "#/components/responses/StaleRevision" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "428": { $ref: "#/components/responses/MissingPrecondition" }
        "503": { $ref: "#/components/responses/StoreInvalid" }

  /tasks/{id}/undelegate:
    post:
      tags: [tasks]
      operationId: undelegateTask
      summary: Clear the delegation marker, revoking any live claim.
      description: |
        Removes the task's `delegation` entirely. Revocation wins: afterwards a
        stale worker's `/release` and `/work_ref` fail their worker match. The
        request has no body and requires the task's current ETag in `If-Match`.

        Lifecycle state is untouched — undelegating does not automatically leave
        `WAITING`, the owner decides. Unlike delegation, this is permitted
        whatever the marker's status and whatever the task's state, since
        clearing provenance from a closed task is the owner's prerogative. An
        undelegated task is a no-op that still returns the current resource.

        `undelegate` is also the delegation **repair** route: alone among these
        actions it owns the whole field, so it may strip a marker a version skew
        or a foreign writer left malformed even while the store is otherwise
        invalid — provided that record is the only problem. That path is
        deliberately **not reachable over HTTP**, because this endpoint requires
        `If-Match` and a repair is refused under any expected revision (the
        baseline was computed over the malformed bytes). Use
        `tasks undelegate <ref>` on the machine holding the store; every HTTP
        delegation action on an invalid store returns `503` / `store_invalid`.
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: The task resource with no delegation.
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Task" }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ClaimConflict" }
        "412": { $ref: "#/components/responses/StaleRevision" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "428": { $ref: "#/components/responses/MissingPrecondition" }
        "503": { $ref: "#/components/responses/StoreInvalid" }

  /tasks/{id}/claim:
    post:
      tags: [tasks]
      operationId: claimTask
      summary: Atomically pick up agent-ready work.
      description: |
        Compare-and-set from `status: ready` to `status: claimed` under the
        store mutation lock, so two workers can never both believe they hold one
        task. Requires the task's current ETag in `If-Match`.

        The response is the whole canonical task resource, not just the marker:
        a worker claims and reads the authority it is working under in one step.

        The two failures are deliberately distinct. `412` / `stale_revision`
        means the client's `If-Match` was out of date — refetch and decide
        again. `409` / `claim_conflict` means the view was current and another
        worker holds the task; `details.holder` and `details.at` name who and
        when. A claim is granted once and never re-granted, so re-claiming with
        the same worker id is also `409`. A task that is not delegated to the
        agent pool is `422`.

        `worker` has no server-side default. The CLI's `TASKS_WORKER_ID`
        convenience is a per-session shell setting for one harness; a shared
        server must never decide who is claiming.
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClaimTaskRequest" }
            examples:
              worker:
                value:
                  worker: "claude-code/claude-fable-5/313cf82e"
      responses:
        "200":
          description: The claimed task resource, with the mode it authorizes.
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Task" }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ClaimConflict" }
        "412": { $ref: "#/components/responses/StaleRevision" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "428": { $ref: "#/components/responses/MissingPrecondition" }
        "503": { $ref: "#/components/responses/StoreInvalid" }

  /tasks/{id}/release:
    post:
      tags: [tasks]
      operationId: releaseTask
      summary: Hand a claim back to the agent-ready queue.
      description: |
        Returns the marker from `claimed` to `ready` and drops the assignee,
        requiring the task's current ETag in `If-Match`. A worker must supply
        the `worker` id matching the live claim; the owner passes `force: true`
        instead to clear a stale claim without undelegating. A mismatched worker
        is `409` / `claim_conflict`; a task that is not claimed is `422`.

        `note` appends a blocker line to the task body in the same undo step as
        the release — one journal entry, one undo. This is how a blocked agent
        surfaces a problem rather than converting refine or research authority
        into implementation.
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReleaseTaskRequest" }
            examples:
              worker:
                summary: The holding worker hands the task back.
                value:
                  worker: "claude-code/claude-fable-5/313cf82e"
              blocked:
                summary: Blocked worker releases with a note.
                value:
                  worker: "claude-code/claude-fable-5/313cf82e"
                  note: "Blocked: needs the vendor's API key before it can proceed."
              force:
                summary: Owner clears a stale claim.
                value:
                  force: true
      responses:
        "200":
          description: The released task resource, agent-ready again.
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Task" }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ClaimConflict" }
        "412": { $ref: "#/components/responses/StaleRevision" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "428": { $ref: "#/components/responses/MissingPrecondition" }
        "503": { $ref: "#/components/responses/StoreInvalid" }

  /tasks/{id}/work_ref:
    put:
      tags: [tasks]
      operationId: setTaskWorkRef
      summary: Replace the task's single work reference.
      description: |
        Records where the work lives — a ticket, PR, research brief, or agent
        session. One reference: writing overwrites, and `null` (or the string
        `off`/`none`) clears. PUT
        rather than POST because this replaces a value on an existing marker
        instead of transitioning it, and repeating the same write is a no-op.
        Requires the task's current ETag in `If-Match`, and the task must
        already carry a delegation (`422` otherwise).

        The owner may always write it. A worker sends its `worker` id and may
        write only while that claim still matches — after an owner revocation
        the stale worker gets `409` / `claim_conflict`. The reference survives
        completion and archival along with the marker that carries it, which is
        how "who did it and where" reaches the archive.
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkRefRequest" }
            examples:
              owner:
                summary: Owner records the ticket.
                value:
                  work_ref: "https://github.com/acme/x/issues/12"
              worker:
                summary: Holding worker records its pull request.
                value:
                  work_ref: "https://github.com/acme/x/pull/42"
                  worker: "claude-code/claude-fable-5/313cf82e"
              clear:
                summary: Clear the reference.
                value:
                  work_ref: null
      responses:
        "200":
          description: The task resource with the updated reference.
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Task" }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ClaimConflict" }
        "412": { $ref: "#/components/responses/StaleRevision" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "428": { $ref: "#/components/responses/MissingPrecondition" }
        "503": { $ref: "#/components/responses/StoreInvalid" }

  /projects:
    get:
      tags: [projects]
      operationId: listProjects
      summary: Projects and areas rolled up over their open tasks.
      description: |
        Returns projects (the section children of the top-level "Projects"
        heading, listed even when empty) followed by areas (other top-level
        sections that currently hold open, non-deferred work; Inbox excluded).
        Each entry carries an open count, a NEXT count, the soonest
        deadline-or-scheduled date, and a `stuck` flag (no open NEXT). Ordered
        projects-before-areas, then by soonest date (nil last), then title.
        `line` is never exposed.
      responses:
        "200":
          description: Projects then areas, in display order.
          headers:
            ETag:
              description: Current global store revision, also present in `meta.store_revision`.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Project" }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
              examples:
                default:
                  value:
                    data:
                      - id: "cccc0004"
                        title: "Site launch"
                        parent_id: "cccc0003"
                        kind: "project"
                        open_count: 3
                        next_count: 1
                        next_date: "2026-07-25"
                        next_time: null
                        next_at: null
                        stuck: false
                        held_count: 1
                        body: "Goal: ship the personal site."
                        task_ids: ["cccc0005", "cccc0006", "cccc0008"]
                      - id: "cccc000d"
                        title: "Tasks"
                        parent_id: null
                        kind: "area"
                        open_count: 2
                        next_count: 1
                        next_date: null
                        next_time: null
                        next_at: null
                        stuck: false
                        held_count: 0
                        body: null
                        task_ids: ["cccc000e", "cccc000f"]
                    meta:
                      store_revision: "s1.6f2a9c0b"
        "503":
          $ref: "#/components/responses/StoreInvalid"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    post:
      tags: [projects]
      operationId: createProject
      summary: Create a new empty project.
      description: |
        Creates a new empty project — a section filed under the top-level
        "Projects" root. When the store has no such root yet (an empty or
        rootless file), the root is created first, then the project beneath it.
        A blank or missing `title` is `422`; a `title` that duplicates an
        existing project or area (case-insensitive — the project candidate set,
        so a duplicate would make later refs ambiguous) is also `422`. Like the
        other project mutations, no `If-Match` precondition is required.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProjectRequest" }
            examples:
              create:
                summary: Start a fresh project.
                value:
                  title: "Mid-year Reviews"
      responses:
        "201":
          description: The newly created project resource.
          headers:
            Location:
              description: Path of the created project.
              schema: { type: string }
            ETag:
              description: Current global store revision.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Project" }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
              examples:
                created:
                  value:
                    data:
                      id: "cccc00a1"
                      title: "Mid-year Reviews"
                      parent_id: "cccc0003"
                      kind: "project"
                      open_count: 0
                      next_count: 0
                      next_date: null
                      next_time: null
                      next_at: null
                      stuck: true
                      held_count: 0
                      body: null
                      task_ids: []
                    meta:
                      store_revision: "s2.9e8d7c6b"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "403":
          $ref: "#/components/responses/ForbiddenOrigin"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/StoreInvalid"

  /projects/{id}:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    get:
      tags: [projects]
      operationId: getProject
      summary: One project or area rolled up over its open tasks.
      description: |
        Returns a single project or area by its section id. An id that is not a
        project or area (a task, Inbox, the Projects heading, a nested
        sub-section, or an area with no open work today) is `404`.
      responses:
        "200":
          description: The project resource.
          headers:
            ETag:
              description: Current global store revision.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Project" }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
              examples:
                default:
                  value:
                    data:
                      id: "cccc0004"
                      title: "Site launch"
                      parent_id: "cccc0003"
                      kind: "project"
                      open_count: 3
                      next_count: 1
                      next_date: "2026-07-25"
                      next_time: null
                      next_at: null
                      stuck: false
                      held_count: 1
                      body: "Goal: ship the personal site."
                      task_ids: ["cccc0005", "cccc0006", "cccc0008"]
                    meta:
                      store_revision: "s1.6f2a9c0b"
        "404":
          $ref: "#/components/responses/NotFound"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "503":
          $ref: "#/components/responses/StoreInvalid"
    patch:
      tags: [projects]
      operationId: renameProject
      summary: Rename a project or area section.
      description: |
        Replaces the section title (leading/trailing whitespace trimmed). A
        blank or missing `title` is `422`; an id that is not a project or area
        (a task, Inbox, the "Projects" heading, a done-pile section) is `404`
        before any write. A rename that moves an area out of scope (e.g.
        retitled "Inbox") still returns its `200` post-state, never a `404`
        after the write committed. Unlike task writes, project mutations carry
        no per-resource revision, so no `If-Match` precondition is required;
        this is a deliberate transport difference under CLI/API parity (design
        rule 7).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenameProjectRequest" }
            examples:
              rename:
                summary: Give the project a clearer title.
                value:
                  title: "Kitchen renovation"
      responses:
        "200":
          description: The renamed project resource.
          headers:
            ETag:
              description: Current global store revision.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Project" }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
              examples:
                renamed:
                  value:
                    data:
                      id: "cccc000a"
                      title: "Kitchen renovation"
                      parent_id: "cccc0003"
                      kind: "project"
                      open_count: 1
                      next_count: 0
                      next_date: null
                      next_time: null
                      next_at: null
                      stuck: true
                      held_count: 0
                      body: null
                      task_ids: ["cccc000b"]
                    meta:
                      store_revision: "s2.1a2b3c4d"
        "404":
          $ref: "#/components/responses/NotFound"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "403":
          $ref: "#/components/responses/ForbiddenOrigin"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/StoreInvalid"

  /projects/{id}/complete:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    post:
      tags: [projects]
      operationId: completeProject
      summary: Close every open task in the project.
      description: |
        Closes every open descendant task of the project — the same cascade as
        completing each task: DONE + today's `closed` date, `defer` dropped, and
        a recurring descendant retired (cookie removed, no roll-forward). The
        section itself remains. Returns the project resource with its refreshed
        counts (`open_count` now 0); a completed area that no longer surfaces in
        the read model still returns its `200` post-state, never a `404` after
        the write committed. An id that is not a project or area (a task, Inbox,
        the "Projects" heading, a done-pile section) is `404` before any write.
        The request takes no body. No `If-Match` precondition (see the rename
        note).
      responses:
        "200":
          description: The project resource after completion (open_count now 0).
          headers:
            ETag:
              description: Current global store revision.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Project" }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
              examples:
                completed:
                  value:
                    data:
                      id: "cccc0004"
                      title: "Site launch"
                      parent_id: "cccc0003"
                      kind: "project"
                      open_count: 0
                      next_count: 0
                      next_date: null
                      next_time: null
                      next_at: null
                      stuck: true
                      held_count: 0
                      body: "Goal: ship the personal site."
                      task_ids: []
                    meta:
                      store_revision: "s2.1a2b3c4d"
        "404":
          $ref: "#/components/responses/NotFound"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "403":
          $ref: "#/components/responses/ForbiddenOrigin"
        "503":
          $ref: "#/components/responses/StoreInvalid"

  /projects/{id}/archive:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    post:
      tags: [projects]
      operationId: archiveProject
      summary: Sweep the project's whole subtree to the archive.
      description: |
        Moves the project's entire section subtree to the archive: the root
        section drops its `parent` and gains today's `archived` stamp. Refuses
        with `409 conflict` while the project still has open work unless
        `force=true` — deferred/held tasks (`held_count`) count as open work
        too, so a parked-but-open project also refuses. The request takes no
        body. No `If-Match` precondition (see the rename note). The project
        resource is gone after this succeeds, so the response is a small archive
        summary rather than a project.
      parameters:
        - name: force
          in: query
          description: Archive even while open tasks remain. Default false.
          required: false
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: The archive summary.
          headers:
            ETag:
              description: Current global store revision.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/ArchiveProjectResult" }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
              examples:
                archived:
                  value:
                    data:
                      id: "cccc000a"
                      archived: 2
                      moved_ids: ["cccc000a", "cccc000b"]
                    meta:
                      store_revision: "s2.1a2b3c4d"
        "409":
          description: The project has open work without `force`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              examples:
                open_tasks:
                  value:
                    error:
                      code: "conflict"
                      message: "The project still has open tasks; retry with force=true to archive them."
                      details:
                        open_count: 3
                        held_count: 0
                      request_id: "req_5e6f"
        "404":
          $ref: "#/components/responses/NotFound"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "403":
          $ref: "#/components/responses/ForbiddenOrigin"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/StoreInvalid"

  /recurrence/explain:
    get:
      tags: [recurrence]
      operationId: explainRecurrence
      summary: Parse, normalize, and project a recurrence schedule without touching a task.
      description: |
        The discoverability half of the recurrence contract, and the API twin of
        `tasks recur --explain`: it answers "what does this schedule mean, and
        when would it fire" for any input the write paths accept, without naming
        a task and without mutating or even reading the store. The intended
        agent flow is propose → explain → verify the projected dates → commit
        with `POST /tasks` or `PATCH /tasks/{id}`.

        Accepts both input syntaxes (see `CreateTaskRequest.recurrence`) and
        returns the canonical spelling that a write would store. Occurrences are
        projected from today in the server's configured time zone; the stamp on
        a task is itself the next occurrence, so this endpoint is the only place
        that projects further ahead.

        Three response shapes, all `200`, because "this is not a schedule" is an
        answer rather than a request error:

        - **projected** — `canonical`, `human`, and `next` (up to `count` dates).
        - **never fires** — `canonical` and `human` parsed, `next` empty, and
          `error` explaining why no occurrence exists from today's anchor (some
          schedules, e.g. `4y:02:5fri`, depend on the anchor, not the grammar).
        - **unparsable** — `input` echoed with the parser's `error` reason and
          nothing else.

        Clearing words (`off`, `none`, `never`) are understood too: they answer
        with `canonical: null` and an empty projection.

        Since no store read happens, the success envelope carries `data` only —
        there is no `meta.store_revision` to report — and the endpoint keeps
        answering while the store is unreadable.
      parameters:
        - name: input
          in: query
          required: true
          description: |
            The schedule to explain, in either input syntax. Required and
            non-blank; an absent or whitespace-only value is `422`. Any
            non-blank value is answered with one of the three shapes above.
          schema: { type: string, minLength: 1 }
        - name: count
          in: query
          required: false
          description: |
            How many occurrences to project. Default 5. Values outside `0..50`
            are clamped to that range rather than rejected (the engine clamps
            identically); a value that is not an integer is `422`.
          schema: { type: integer, default: 5 }
      responses:
        "200":
          description: The parsed schedule, or the reason the input was not one.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data: { $ref: "#/components/schemas/RecurrenceExplanation" }
              examples:
                projected:
                  summary: An understood schedule with its next occurrences.
                  value:
                    data:
                      input: "every mon wed fri"
                      canonical: "w:mon,wed,fri"
                      human: "every Mon, Wed, Fri"
                      next: ["2026-07-29", "2026-07-31", "2026-08-03"]
                cleared:
                  summary: A clearing word, understood and projecting nothing.
                  value:
                    data:
                      input: "off"
                      canonical: null
                      human: "no recurrence"
                      next: []
                never_fires:
                  summary: Understood, but no occurrence exists from today's anchor.
                  value:
                    data:
                      input: "4y:02:5fri"
                      canonical: "4y:02:5fri"
                      human: "every 4 years on the 5th Friday of February"
                      next: []
                      error: 'no occurrence of "4y:02:5fri" within 2000 years from 2026-07-28 — the schedule may never fire for this anchor'
                unparsable:
                  summary: Not a schedule at all.
                  value:
                    data:
                      input: "every blursday"
                      error: 'unrecognized schedule: "every blursday"'
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /views/{name}:
    parameters:
      - name: name
        in: path
        required: true
        description: Canonical named selection.
        schema:
          type: string
          enum: [agenda, next, quadrants, inbox, projects]
    get:
      tags: [views]
      operationId: getView
      summary: A canonical named selection with grouping metadata.
      description: |
        Returns the same task selection and ordering as the CLI/TUI named views
        so their semantics are not reimplemented in the browser. `quadrants`
        adds a `quadrant` label per item; `projects` groups by nearest open
        project.
